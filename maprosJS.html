    const justificativa = criarTextareaAtividadeMapro(
      atividade.justificativa,
      'justificativa',
      1500,
      atividade.status === 'NAO_APLICAVEL' ? 'Obrigatória para não aplicável' : '—'
    );
    justificativa.disabled = !podeEditarLinha;
    linha.appendChild(criarCelulaControleMapro('Justificativa', justificativa));
    const observacao = criarTextareaAtividadeMapro(atividade.observacao, 'observacao', 3000, 'Observação');
    observacao.disabled = !podeEditarLinha;
    linha.appendChild(criarCelulaControleMapro('Observação/Motivo', observacao));

    linha.appendChild(criarMenuMaisAtividadeMapro(atividade, podeEditarLinha));

    linha.addEventListener('dragover', function (evento) {
      if (!podeSoltarAtividadeMapro(estadoMapros.atividadeArrastada, atividade)) return;
      evento.preventDefault();
      evento.dataTransfer.dropEffect = 'move';
      linha.classList.add('destino-arraste-mapro');
    });
    linha.addEventListener('dragleave', function () { linha.classList.remove('destino-arraste-mapro'); });
    linha.addEventListener('drop', function (evento) {
      evento.preventDefault();
      linha.classList.remove('destino-arraste-mapro');
      moverAtividadePorArrasteMapro(estadoMapros.atividadeArrastada, atividade);
    });

    linha.querySelectorAll('input[data-campo], select[data-campo], textarea[data-campo]').forEach(function (controle) {
      controle.addEventListener('focus', function () {
        atividade.snapshotAntesEdicao = criarSnapshotAtividadeMapro(atividade);
      });
      controle.addEventListener('input', function () {
        atualizarAtividadePelaLinhaMapro(atividade, linha, controle.dataset.campo, 'input');
        agendarSalvamentoAtividadeMapro(atividade, 180);
      });
      controle.addEventListener('change', function () {
        atualizarAtividadePelaLinhaMapro(atividade, linha, controle.dataset.campo, 'change');
        if (!atividade.rascunho && !atividade.replanejamentoPendente &&
            controle.dataset.campo !== 'dataInicio' &&
            controle.dataset.campo !== 'dataFinal' && atividade.snapshotAntesEdicao) {
          const anterior = atividade.snapshotAntesEdicao;
          const atual = criarSnapshotAtividadeMapro(atividade);
          if (JSON.stringify(anterior) !== JSON.stringify(atual)) {
            registrarAlteracaoDesfazerMapro({
              tipo: 'edicao', idAtividade: atividade.idAtividade, anterior: anterior
            });
          }
        }
        atividade.snapshotAntesEdicao = null;
        agendarSalvamentoAtividadeMapro(atividade, 0);
      });
      if (controle.dataset.campo === 'dataInicio' || controle.dataset.campo === 'dataFinal') {
        controle.addEventListener('blur', function () {
          atualizarAtividadePelaLinhaMapro(atividade, linha, controle.dataset.campo, 'blur');
        });
      }
    });
    return linha;
  }

  function criarSnapshotAtividadeMapro(atividade) {
    return {
      nomeAtividade: atividade.nomeAtividade,
      idResponsavel: atividade.idResponsavel,
      responsavel: atividade.responsavel,
      departamento: atividade.departamento,
      idAtividadePredecessora: atividade.idAtividadePredecessora || '',
      idAtividadePredecessoraRegistrada: atividade.idAtividadePredecessoraRegistrada || '',
      dataInicio: atividade.dataInicio,
      dataFinal: atividade.dataFinal,
      semanaInicio: atividade.semanaInicio,
      semanaFinal: atividade.semanaFinal,
      status: atividade.status,
      saude: atividade.saude,
      justificativa: atividade.justificativa,
      observacao: atividade.observacao
    };
  }

  function podeSubstituirEvidenciaMapro(atividade) {
    if (!atividade.evidenciaUrl && !atividade.evidenciaId) return true;
    if (estadoMapros.pagina && estadoMapros.pagina.admin) return true;
    const emailAtual = String(
      estadoMapros.pagina && estadoMapros.pagina.usuario
        ? estadoMapros.pagina.usuario.email : ''
    ).trim().toLowerCase();
    return Boolean(emailAtual) && emailAtual === String(
      atividade.evidenciaEnviadaPor || ''
    ).trim().toLowerCase();
  }

  function criarMenuMaisAtividadeMapro(atividade, podeEditarLinha) {
    const celula = document.createElement('td');
    celula.dataset.label = 'Mais';
    const grupo = document.createElement('div');
    grupo.className = 'menu-mais-atividade';
    const acionador = document.createElement('button');
    acionador.type = 'button';
    acionador.className = 'botao-mais-atividade';
    acionador.textContent = '⋯';
    acionador.title = 'Mais opções';
    acionador.setAttribute('aria-label', 'Mais opções da atividade');
    const opcoes = document.createElement('div');
    opcoes.className = 'opcoes-mais-atividade';
    opcoes.hidden = true;
    const evidencia = document.createElement('button');
    evidencia.type = 'button';
    const podeSubstituir = podeEditarLinha && podeSubstituirEvidenciaMapro(atividade);
    evidencia.textContent = atividade.evidenciaUrl
      ? (podeSubstituir ? 'Ver ou substituir evidência' : 'Visualizar evidência')
      : 'Inserir evidência';
    evidencia.disabled = Boolean(atividade.rascunho || (!atividade.evidenciaUrl && !podeSubstituir));
    evidencia.addEventListener('click', function () {
      opcoes.hidden = true;
      abrirModalEvidenciaAtividadeMapro(atividade);
    });
    const historico = document.createElement('button');
    historico.type = 'button';
    historico.textContent = 'Visualizar histórico';
    historico.disabled = Boolean(atividade.rascunho || atividade.tipo === 'TOPICO');
    historico.addEventListener('click', function () {
      opcoes.hidden = true;
      abrirHistoricoReprogramacaoMapro(atividade);
    });
    acionador.addEventListener('click', function (evento) {
      evento.stopPropagation();
      document.querySelectorAll('.opcoes-mais-atividade').forEach(function (menu) {
        if (menu !== opcoes) menu.hidden = true;
      });
      const abrir = opcoes.hidden;
      opcoes.hidden = !abrir;
      if (abrir) {
        const caixa = acionador.getBoundingClientRect();
        const largura = 180;
        const espacoAbaixo = window.innerHeight - caixa.bottom;
        opcoes.style.left = Math.max(8, Math.min(caixa.right - largura, window.innerWidth - largura - 8)) + 'px';
        opcoes.style.top = (espacoAbaixo >= 96 ? caixa.bottom + 4 : Math.max(8, caixa.top - 92)) + 'px';
      }
    });
    opcoes.append(evidencia, historico);
    grupo.append(acionador, opcoes);
    celula.appendChild(grupo);
    return celula;
  }

  function abrirModalEvidenciaAtividadeMapro(atividade) {
    estadoMapros.atividadeEvidenciaSelecionada = atividade;
    document.getElementById('nome-atividade-evidencia-mapro').textContent = atividade.nomeAtividade;
    document.getElementById('arquivo-evidencia-modal-mapro').value = '';
    const evidenciaAtual = document.getElementById('evidencia-atual-mapro');
    const linkAtual = document.getElementById('link-evidencia-atual-mapro');
    const possuiEvidencia = Boolean(atividade.evidenciaUrl);
    const podeSubstituir = Boolean(estadoMapros.modoEdicaoAtividades) &&
      podeEditarAtividadeClienteMapro(atividade) && podeSubstituirEvidenciaMapro(atividade);
    evidenciaAtual.hidden = !possuiEvidencia;
    linkAtual.href = possuiEvidencia ? atividade.evidenciaUrl : '#';
    linkAtual.textContent = possuiEvidencia
      ? (atividade.evidenciaNome || 'Visualizar evidência') : '';
    const campoArquivo = document.getElementById('arquivo-evidencia-modal-mapro');
    const botaoConfirmar = document.getElementById('confirmar-evidencia-modal-mapro');
    campoArquivo.hidden = !podeSubstituir;
    campoArquivo.disabled = !podeSubstituir;
    botaoConfirmar.hidden = !podeSubstituir;
    botaoConfirmar.textContent = possuiEvidencia ? 'SUBSTITUIR' : 'ANEXAR';
    abrirModalMapros('modal-evidencia-atividade');
  }

  function podeSoltarAtividadeMapro(origem, destino) {
    if (!estadoMapros.modoEdicaoAtividades ||
        !estadoMapros.detalhe.permissao.podeEditarTudo) return false;
    if (!origem || !destino || origem === destino || origem.rascunho || destino.rascunho) return false;
    if (estadoMapros.movimentosPendentes[origem.idAtividade] ||
        estadoMapros.movimentosPendentes[destino.idAtividade]) return false;
    if (origem.tipo === 'TOPICO') return destino.tipo === 'TOPICO';
    if (origem.tipo === 'ATIVIDADE') return destino.tipo === 'TOPICO' || destino.tipo === 'ATIVIDADE';
    if (origem.tipo === 'SUBATIVIDADE') return destino.tipo === 'ATIVIDADE' || destino.tipo === 'SUBATIVIDADE';
    return false;
  }

  function moverAtividadePorArrasteMapro(atividade, destino) {
    if (!podeSoltarAtividadeMapro(atividade, destino)) return;
    const anterior = { idAtividadePai: atividade.idAtividadePai, ordem: atividade.ordem };
    clearTimeout(temporizadoresAtividadesMapro[atividade.idAtividade]);
    const moverParaDentro = (atividade.tipo === 'ATIVIDADE' && destino.tipo === 'TOPICO') ||
      (atividade.tipo === 'SUBATIVIDADE' && destino.tipo === 'ATIVIDADE');
    const novoPai = atividade.tipo === 'TOPICO'
      ? ''
      : (moverParaDentro ? destino.idAtividade : destino.idAtividadePai);
    const irmas = estadoMapros.detalhe.atividades.filter(function (item) {
      return item.idAtividadePai === novoPai && item.idAtividade !== atividade.idAtividade;
    });
    atividade.idAtividadePai = novoPai;
    atividade.ordem = moverParaDentro
      ? irmas.reduce(function (maior, item) { return Math.max(maior, Number(item.ordem || 0)); }, Number(destino.ordem || 0)) + 1
      : Number(destino.ordem || 0) + 0.5;
    estadoMapros.movimentosPendentes[atividade.idAtividade] = true;
    renderizarAtividadesMapro();
    filaMovimentosAtividadesMapro = filaMovimentosAtividadesMapro.then(async function () {
      try {
        const resposta = await chamarServidorMapros(
          'moverAtividadeMapro', estadoMapros.detalhe.mapro.idMapro,
          atividade.idAtividade, destino.idAtividade, atividade.version
        );
        if (!resposta.sucesso) throw new Error(resposta.mensagem);
        Object.assign(atividade, resposta.dados && resposta.dados.atividade || {});
        delete estadoMapros.movimentosPendentes[atividade.idAtividade];
        const linhaAtual = document.querySelector('[data-atividade-id="' + atividade.idAtividade + '"]');
        if (linhaAtual) {
          linhaAtual.classList.remove('linha-movendo');
          const botaoMover = linhaAtual.querySelector('.botao-mover-linha');
          if (botaoMover) botaoMover.disabled = false;
        }
        mostrarAvisoMapros(resposta.mensagem);
      } catch (erro) {
        Object.assign(atividade, anterior);
        delete estadoMapros.movimentosPendentes[atividade.idAtividade];
        renderizarAtividadesMapro();
        mostrarAvisoMapros(erro.message, true);
      } finally {
        estadoMapros.atividadeArrastada = null;
      }
    });
  }

  function adicionarRascunhoAtividadeMapro(idPai) {
    if (!estadoMapros.modoEdicaoAtividades ||
        !estadoMapros.detalhe.permissao.podeEditarTudo) return;
    const idTemporario = 'rascunho-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    const pai = estadoMapros.detalhe.atividades.find(function (item) {
      return item.idAtividade === idPai;
    });
    if (pai && pai.tipo === 'ATIVIDADE') {
      const participaDeDependencia = Boolean(pai.idAtividadePredecessora) ||
        estadoMapros.detalhe.atividades.some(function (item) {
          return String(item.idAtividadePredecessora || '') === String(pai.idAtividade);
        });
      if (participaDeDependencia) {
        mostrarAvisoMapros(
          'Remova a relação de predecessora antes de adicionar uma subatividade.', true
        );
        return;
      }
    }
    const tipo = !pai ? 'TOPICO' : pai.tipo === 'TOPICO' ? 'ATIVIDADE' : 'SUBATIVIDADE';
    const maiorOrdem = estadoMapros.detalhe.atividades.concat(estadoMapros.rascunhosAtividades)
      .reduce(function (maior, item) { return Math.max(maior, Number(item.ordem || 0)); }, 0);
    estadoMapros.rascunhosAtividades.push({
      idAtividade: idTemporario,
      idMapro: estadoMapros.detalhe.mapro.idMapro,
      idAtividadePai: idPai || '',
      ordem: maiorOrdem + 1,
      tipo: tipo,
      nomeAtividade: '', idResponsavel: '', responsavel: '', departamento: '',
      dataInicio: '', dataFinal: '', semanaInicio: '—', semanaFinal: '—',
      idAtividadePredecessora: '', diasReplanejados: 0,
      idAtividadePredecessoraRegistrada: '',
      status: 'PLANEJADA', saude: 'VERDE', justificativa: '', observacao: '',
      dataInicioRegistrada: '', dataFinalRegistrada: '', observacaoRegistrada: '',
      evidenciaId: '', evidenciaNome: '', evidenciaTipo: '', evidenciaUrl: '',
      evidenciaEnviadaPor: '',
      version: 0, rascunho: true
    });
    renderizarAtividadesMapro();
    const linha = document.querySelector('[data-atividade-id="' + idTemporario + '"]');
    if (linha) linha.querySelector('[data-campo="nomeAtividade"]').focus();
  }

  function atualizarAtividadePelaLinhaMapro(atividade, linha, campoAlterado, tipoEvento) {
    const statusAnterior = atividade.status;
    const dataInicioAnterior = atividade.dataInicio;
    const dataFinalAnterior = atividade.dataFinal;
    linha.querySelectorAll('[data-campo]').forEach(function (controle) {
      atividade[controle.dataset.campo] = controle.value;
    });
    atividade.semanaInicio = formatarSemanaMapros(atividade.dataInicio);
    atividade.semanaFinal = formatarSemanaMapros(atividade.dataFinal);
    const datasCompletas = dataIsoCompletaValidaMapros(atividade.dataInicio) &&
      dataIsoCompletaValidaMapros(atividade.dataFinal);
    const prazoInvalido = datasCompletas && atividade.dataFinal < atividade.dataInicio;
    const campoFinal = linha.querySelector('[data-campo="dataFinal"]');
    const aguardandoSaidaDoPrazo = campoAlterado === 'dataFinal' && tipoEvento !== 'blur';
    if (campoFinal) {
      campoFinal.setCustomValidity(!aguardandoSaidaDoPrazo && prazoInvalido
        ? 'O prazo final não pode ser menor que o prazo inicial.' : '');
      campoFinal.classList.toggle('campo-data-invalido-mapro', !aguardandoSaidaDoPrazo && prazoInvalido);
    }
    if (prazoInvalido && tipoEvento === 'blur' &&
        (campoAlterado === 'dataInicio' || campoAlterado === 'dataFinal')) {
      mostrarAvisoMapros('O prazo final não pode ser menor que o prazo inicial.', true);
    }
    linha.dataset.erroPrazo = !aguardandoSaidaDoPrazo && prazoInvalido ? 'sim' : 'nao';
    const houveReplanejamento = estadoMapros.detalhe.mapro.acompanhamentoIniciado &&
      !atividade.rascunho && (
      String(atividade.dataInicio || '') !== String(atividade.dataInicioRegistrada || '') ||
      String(atividade.dataFinal || '') !== String(atividade.dataFinalRegistrada || '')
    );
    linha.dataset.avisoReplanejamento = houveReplanejamento ? 'sim' : 'nao';
    atividade.replanejamentoPendente = houveReplanejamento;
    if (!houveReplanejamento) atividade.avisoReplanejamentoExibido = false;
    if (houveReplanejamento && datasCompletas && !prazoInvalido && tipoEvento === 'blur' &&
        (campoAlterado === 'dataInicio' || campoAlterado === 'dataFinal') &&
        !atividade.avisoReplanejamentoExibido) {
      atividade.avisoReplanejamentoExibido = true;
      mostrarAvisoMapros(
        'A alteração de prazo exige o preenchimento de OBSERVAÇÃO/MOTIVO antes de salvar.', true
      );
    }
    atualizarBotaoSalvarPrazosMapro();
    const justificativa = linha.querySelector('[data-campo="justificativa"]');
    if (justificativa) {
      justificativa.placeholder = atividade.status === 'NAO_APLICAVEL'
        ? 'Obrigatória para não aplicável' : '—';
    }
    if (atividade.status === 'NAO_APLICAVEL' && statusAnterior !== 'NAO_APLICAVEL' &&
        atividade.justificativa.trim().length < 5) {
      mostrarAvisoMapros('Obrigatório o preenchimento da justificativa.', true);
      if (justificativa) justificativa.focus();
    }
    const semanaInicio = linha.querySelector('.semana-inicio-atividade-mapro');
    const semanaFinal = linha.querySelector('.semana-final-atividade-mapro');
    if (semanaInicio) semanaInicio.textContent = atividade.semanaInicio;
    if (semanaFinal) semanaFinal.textContent = atividade.semanaFinal;
    if (statusAnterior !== atividade.status || dataInicioAnterior !== atividade.dataInicio ||
        dataFinalAnterior !== atividade.dataFinal) {
      atividade.saude = calcularSaudeAtividadeClienteMapro(atividade);
      const statusVisual = linha.querySelector('.bolinha-status');
      if (statusVisual) {
        statusVisual.className = 'bolinha-status status-' + atividade.saude.toLowerCase();
        statusVisual.title = descreverSaudeMapro(atividade.saude);
      }
      sincronizarAgregadosTopicosNaTabelaMapro();
      atualizarResumoExecutivoMapro(
        estadoMapros.detalhe.atividades.concat(estadoMapros.rascunhosAtividades)
      );
    }
  }

  function atividadeProntaParaSalvarMapro(atividade) {
    const nomeValido = atividade.nomeAtividade.trim().length >= 3;
    const justificativaValida = atividade.status !== 'NAO_APLICAVEL' ||
      atividade.justificativa.trim().length >= 5;
    const houveReplanejamento = estadoMapros.detalhe.mapro.acompanhamentoIniciado &&
      !atividade.rascunho && (
      String(atividade.dataInicio || '') !== String(atividade.dataInicioRegistrada || '') ||
      String(atividade.dataFinal || '') !== String(atividade.dataFinalRegistrada || '')
    );
    const motivoReplanejamentoValido = !houveReplanejamento ||
      (atividade.observacao.trim().length >= 5 &&
        atividade.observacao.trim() !== String(atividade.observacaoRegistrada || '').trim());
    if (atividade.tipo === 'TOPICO') return nomeValido && justificativaValida;
    return nomeValido && Boolean(atividade.idResponsavel) && Boolean(atividade.departamento) &&
      dataIsoCompletaValidaMapros(atividade.dataInicio) &&
      dataIsoCompletaValidaMapros(atividade.dataFinal) &&
      atividade.dataFinal >= atividade.dataInicio && justificativaValida && motivoReplanejamentoValido;
  }

  function assinaturaAtividadeMapro(atividade) {
    return JSON.stringify([
      atividade.tipo, atividade.idAtividadePai, atividade.nomeAtividade, atividade.idResponsavel,
      atividade.departamento, atividade.dataInicio, atividade.dataFinal, atividade.status,
      atividade.idAtividadePredecessora || '', atividade.justificativa, atividade.observacao
    ]);
  }

  function agendarSalvamentoAtividadeMapro(atividade, atraso) {
    clearTimeout(temporizadoresAtividadesMapro[atividade.idAtividade]);
    estadoMapros.idsAtividadesEditadas[atividade.idAtividade] = true;
    const linha = document.querySelector('[data-atividade-id="' + atividade.idAtividade + '"]');
    if (linha) linha.classList.add('alteracao-pendente');
    atualizarBotaoSalvarPrazosMapro();
  }

  async function salvarAtividadeInlineMapro(atividade, confirmarReplanejamento, propagarErro) {
    if (atividade.replanejamentoPendente && !confirmarReplanejamento) return false;
    if (!atividadeProntaParaSalvarMapro(atividade)) return false;
    const assinatura = assinaturaAtividadeMapro(atividade);
    if (assinatura === atividade.assinaturaSalva) return true;
    const idAnterior = atividade.idAtividade;
    const linha = document.querySelector('[data-atividade-id="' + idAnterior + '"]');
    if (linha) linha.classList.add('salvando');
    if (autosaveMaproPendente && !autosaveMaproEmAndamento) await executarAutosaveMapro();
    while (autosaveMaproEmAndamento) {
      await new Promise(function (resolve) { setTimeout(resolve, 50); });
    }
    atividadeMaproEmSalvamento = true;
    const dados = {
      idAtividade: atividade.rascunho ? '' : atividade.idAtividade,
      idMapro: estadoMapros.detalhe.mapro.idMapro,
      version: atividade.version || 0,
      tipo: atividade.tipo,
      idAtividadePai: atividade.idAtividadePai,
      idAtividadePredecessora: atividade.idAtividadePredecessora || '',
      nomeAtividade: atividade.nomeAtividade,
      idResponsavel: atividade.idResponsavel,
      departamento: atividade.departamento,
      dataInicio: atividade.dataInicio,
      dataFinal: atividade.dataFinal,
      status: atividade.status,
      justificativa: atividade.justificativa || '',
      observacao: atividade.observacao || '',
      confirmarReplanejamento: Boolean(confirmarReplanejamento)
    };
    let salvou = false;
    try {
      const resposta = await chamarServidorMapros('salvarAtividadeMapro', dados);
      if (!resposta.sucesso) throw new Error(resposta.mensagem);
      const resultado = resposta.dados || {};
      const salva = resultado.atividade;
      salvou = true;
      const houveNovaEdicaoDuranteSalvamento = assinaturaAtividadeMapro(atividade) !== assinatura;
      if (atividade.rascunho) {
        estadoMapros.rascunhosAtividades = estadoMapros.rascunhosAtividades.filter(function (item) {
          return item !== atividade;
        });
        if (houveNovaEdicaoDuranteSalvamento) {
          atividade.idAtividade = salva.idAtividade;
          atividade.version = salva.version;
          atividade.rascunho = false;
        } else {
          Object.assign(atividade, salva, { rascunho: false });
        }
        atividade.assinaturaSalva = assinatura;
        estadoMapros.detalhe.atividades.push(atividade);
      } else {
        if (houveNovaEdicaoDuranteSalvamento) {
          atividade.version = salva.version;
        } else {
          Object.assign(atividade, salva);
        }
        atividade.assinaturaSalva = assinatura;
      }
      atividade.dataInicioRegistrada = dados.dataInicio;
      atividade.dataFinalRegistrada = dados.dataFinal;
      atividade.idAtividadePredecessoraRegistrada = dados.idAtividadePredecessora;
      atividade.observacaoRegistrada = dados.observacao;
      atividade.replanejamentoPendente = false;
      atividade.avisoReplanejamentoExibido = false;
      (resultado.atividadesReplanejadas || []).forEach(function (replanejada) {
        const sucessora = estadoMapros.detalhe.atividades.find(function (item) {
          return String(item.idAtividade) === String(replanejada.idAtividade);
        });
        if (!sucessora) return;
        Object.assign(sucessora, replanejada, {
          dataInicioRegistrada: replanejada.dataInicio,
          dataFinalRegistrada: replanejada.dataFinal,
          semanaInicio: formatarSemanaMapros(replanejada.dataInicio),
          semanaFinal: formatarSemanaMapros(replanejada.dataFinal),
          replanejamentoPendente: false,
          avisoReplanejamentoExibido: false
        });
        sucessora.saude = calcularSaudeAtividadeClienteMapro(sucessora);
        sucessora.assinaturaSalva = assinaturaAtividadeMapro(sucessora);
      });
      const resumo = resultado.resumoProjeto || {};
      if (typeof resumo.acompanhamentoIniciado === 'boolean') {
        estadoMapros.detalhe.mapro.acompanhamentoIniciado = resumo.acompanhamentoIniciado;
        if (resumo.acompanhamentoIniciado) {
          document.getElementById('iniciar-acompanhamento-mapro').hidden = true;
        }
      }
      if (resumo.version) {
        const versaoAtual = Number(estadoMapros.detalhe.mapro.version || 0);
        estadoMapros.detalhe.mapro.version = Math.max(versaoAtual, Number(resumo.version));
        document.getElementById('mapro-version').value = estadoMapros.detalhe.mapro.version;
      }
      estadoMapros.detalhe.mapro.dataInicio = resumo.dataInicio || '';
      estadoMapros.detalhe.mapro.dataFinal = resumo.dataFinal || '';
      document.getElementById('mapro-data-inicio').value = resumo.dataInicio || '';
      document.getElementById('mapro-data-final').value = resumo.dataFinal || '';
      document.getElementById('mapro-semana-final').textContent = formatarSemanaMapros(resumo.dataFinal);
      if (idAnterior.indexOf('rascunho-') === 0) promoverLinhaRascunhoMapro(linha, atividade);
      const linhaAtual = document.querySelector('[data-atividade-id="' + atividade.idAtividade + '"]');
      if (linhaAtual) {
        linhaAtual.classList.remove('salvando', 'alteracao-pendente', 'falha-salvamento');
      }
      atualizarBotaoSalvarPrazosMapro();
      sincronizarAgregadosTopicosNaTabelaMapro();
      atualizarResumoExecutivoMapro(
        estadoMapros.detalhe.atividades.concat(estadoMapros.rascunhosAtividades)
      );
    } catch (erro) {
      if (linha) {
        linha.classList.remove('salvando');
        linha.classList.add('falha-salvamento');
      }
      if (!propagarErro) mostrarAvisoMapros(erro.message, true);
      if (!propagarErro && erro.message === 'Falha de comunicação com o servidor.') {
        agendarSalvamentoAtividadeMapro(atividade, 2500);
      }
      if (propagarErro) throw erro;
    } finally {
      atividadeMaproEmSalvamento = false;
      if (salvou && !atividade.replanejamentoPendente &&
          assinaturaAtividadeMapro(atividade) !== atividade.assinaturaSalva) {
        agendarSalvamentoAtividadeMapro(atividade, 0);
      }
      if (autosaveMaproPendente) agendarAutosaveMapro(100);
    }
    return salvou;
  }

  function atualizarBotaoSalvarPrazosMapro() {
    const botao = document.getElementById('salvar-prazos-mapro');
    if (!botao || !estadoMapros.detalhe) return;
    botao.disabled = !estadoMapros.modoEdicaoAtividades ||
      estadoMapros.salvandoEdicoesAtividades || !usuarioPodeEditarTabelaAtividadesMapro();
    botao.textContent = '💾 SALVAR EDIÇÕES';
  }

  function obterAtividadesComEdicaoPendenteMapro() {
    if (!estadoMapros.detalhe) return [];
    return estadoMapros.detalhe.atividades.concat(estadoMapros.rascunhosAtividades).filter(function (atividade) {
      return podeEditarAtividadeClienteMapro(atividade) && (
        atividade.rascunho || estadoMapros.idsAtividadesEditadas[atividade.idAtividade]
      );
    });
  }

  function temEdicoesAtividadesPendentesMapro() {
    return obterAtividadesComEdicaoPendenteMapro().length > 0;
  }

  function focarCampoEdicaoAtividadeMapro(atividade, campo) {
    const linha = document.querySelector('[data-atividade-id="' + atividade.idAtividade + '"]');
    const controle = linha && linha.querySelector('[data-campo="' + campo + '"]');
    if (controle) controle.focus();
  }

  function validarEdicoesAtividadesMapro(pendentes) {
    for (let indice = 0; indice < pendentes.length; indice += 1) {
      const atividade = pendentes[indice];
      if (String(atividade.nomeAtividade || '').trim().length < 3) {
        mostrarAvisoMapros('Informe uma descrição com pelo menos 3 caracteres.', true);
        focarCampoEdicaoAtividadeMapro(atividade, 'nomeAtividade');
        return false;
      }
      if (atividade.status === 'NAO_APLICAVEL' &&
          String(atividade.justificativa || '').trim().length < 5) {
        mostrarAvisoMapros('Obrigatório o preenchimento da justificativa para atividade não aplicável.', true);
        focarCampoEdicaoAtividadeMapro(atividade, 'justificativa');
        return false;
      }
      if (atividade.tipo === 'TOPICO') continue;
      if (!atividade.idResponsavel || !atividade.departamento) {
        mostrarAvisoMapros('Selecione o responsável da atividade antes de salvar.', true);
        focarCampoEdicaoAtividadeMapro(atividade, 'idResponsavel');
        return false;
      }
      if (!dataIsoCompletaValidaMapros(atividade.dataInicio) ||
          !dataIsoCompletaValidaMapros(atividade.dataFinal)) {
        mostrarAvisoMapros('Preencha as datas de início e prazo final antes de salvar.', true);
        focarCampoEdicaoAtividadeMapro(
          atividade, dataIsoCompletaValidaMapros(atividade.dataInicio) ? 'dataFinal' : 'dataInicio'
        );
        return false;
      }
      if (atividade.dataFinal < atividade.dataInicio) {
        mostrarAvisoMapros('O prazo final não pode ser menor que o prazo inicial.', true);
        focarCampoEdicaoAtividadeMapro(atividade, 'dataFinal');
        return false;
      }
      if (!atividade.replanejamentoPendente) continue;
      const motivo = String(atividade.observacao || '').trim();
      if (motivo.length < 5 || motivo === String(atividade.observacaoRegistrada || '').trim()) {
        mostrarAvisoMapros('Obrigatório preencher OBSERVAÇÃO/MOTIVO para salvar o replanejamento.', true);
        focarCampoEdicaoAtividadeMapro(atividade, 'observacao');
        return false;
      }
    }
    return true;
  }

  function profundidadePredecessoraMapro(atividade, porId) {
    let profundidade = 0;
    let atual = atividade;
    const visitadas = {};
    while (atual && atual.idAtividadePredecessora) {
      const id = String(atual.idAtividadePredecessora);
      if (visitadas[id]) break;
      visitadas[id] = true;
      profundidade += 1;
      atual = porId[id];
    }
    return profundidade;
  }

  async function salvarEdicoesAtividadesMapro() {
    if (!estadoMapros.modoEdicaoAtividades || estadoMapros.salvandoEdicoesAtividades) return;
    const porId = {};
    estadoMapros.detalhe.atividades.concat(estadoMapros.rascunhosAtividades)
      .forEach(function (atividade) { porId[String(atividade.idAtividade)] = atividade; });
    const pendentes = obterAtividadesComEdicaoPendenteMapro().sort(function (a, b) {
      const ordemTipo = { TOPICO: 0, ATIVIDADE: 1, SUBATIVIDADE: 2 };
      const relacaoAlteradaA = String(a.idAtividadePredecessora || '') !==
        String(a.idAtividadePredecessoraRegistrada || '');
      const relacaoAlteradaB = String(b.idAtividadePredecessora || '') !==
        String(b.idAtividadePredecessoraRegistrada || '');
      return Number(relacaoAlteradaB) - Number(relacaoAlteradaA) ||
        profundidadePredecessoraMapro(b, porId) - profundidadePredecessoraMapro(a, porId) ||
        ordemTipo[a.tipo] - ordemTipo[b.tipo] || Number(a.ordem || 0) - Number(b.ordem || 0);
    });
    if (!validarEdicoesAtividadesMapro(pendentes)) return;

    estadoMapros.salvandoEdicoesAtividades = true;
    atualizarBotaoSalvarPrazosMapro();
    MaproUI.showLoading('Salvando edições da tabela...');
    await aguardarPinturaMapros();
    try {
      await aguardarAutosaveCabecalhoMapro();
      await filaMovimentosAtividadesMapro;
      const edicoes = pendentes.map(function (atividade) {
        return {
          idAtividadeCliente: atividade.idAtividade,
          idAtividade: atividade.rascunho ? '' : atividade.idAtividade,
          idMapro: estadoMapros.detalhe.mapro.idMapro,
          version: atividade.version || 0,
          tipo: atividade.tipo,
          idAtividadePai: atividade.idAtividadePai,
          idAtividadePredecessora: atividade.idAtividadePredecessora || '',
          nomeAtividade: atividade.nomeAtividade,
          idResponsavel: atividade.idResponsavel,
          departamento: atividade.departamento,
          dataInicio: atividade.dataInicio,
          dataFinal: atividade.dataFinal,
          status: atividade.status,
          justificativa: atividade.justificativa || '',
          observacao: atividade.observacao || '',
          confirmarReplanejamento: Boolean(atividade.replanejamentoPendente)
        };
      });
      const resposta = await aguardarComLimiteMapro(
        chamarServidorMapros('salvarEdicoesAtividadesMapro', {
          idMapro: estadoMapros.detalhe.mapro.idMapro,
          edicoes: edicoes
        }),
        120000
      );
      if (!resposta.sucesso) throw new Error(resposta.mensagem);
      const resultado = resposta.dados || {};
      estadoMapros.detalhe.atividades = resultado.atividades || [];
      estadoMapros.detalhe.atividades.forEach(function (atividade) {
        atividade.assinaturaSalva = assinaturaAtividadeMapro(atividade);
      });
      estadoMapros.rascunhosAtividades = [];
      const resumo = resultado.resumoProjeto || {};
      if (resumo.version) {
        estadoMapros.detalhe.mapro.version = resumo.version;
        document.getElementById('mapro-version').value = resumo.version;
      }
      estadoMapros.detalhe.mapro.dataInicio = resumo.dataInicio || '';
      estadoMapros.detalhe.mapro.dataFinal = resumo.dataFinal || '';
      document.getElementById('mapro-data-inicio').value = resumo.dataInicio || '';
      document.getElementById('mapro-data-final').value = resumo.dataFinal || '';
      document.getElementById('mapro-semana-final').textContent =
        formatarSemanaMapros(resumo.dataFinal);
      estadoMapros.idsAtividadesEditadas = {};
      estadoMapros.modoEdicaoAtividades = false;
      renderizarAtividadesMapro();
      mostrarAvisoMapros(resposta.mensagem || 'Edições salvas com sucesso.');
    } catch (erro) {
      mostrarAvisoMapros(erro.message, true);
    } finally {
      estadoMapros.salvandoEdicoesAtividades = false;
      atualizarBotaoSalvarPrazosMapro();
      atualizarEstadoModoEdicaoAtividadesMapro();
      MaproUI.hideLoading();
    }
  }

  function promoverLinhaRascunhoMapro(linha, atividade) {
    if (!linha) return;
    linha.dataset.atividadeId = atividade.idAtividade;
    linha.classList.remove('linha-rascunho');
    const adicionar = linha.querySelector('.botao-adicionar-linha');
    if (adicionar) adicionar.disabled = false;
    const mover = linha.querySelector('.botao-mover-linha');
    if (mover) {
      mover.disabled = atividade.tipo === 'TOPICO';
      mover.closest('tr').draggable = false;
    }
    const cancelar = linha.querySelector('.botao-cancelar-linha');
    if (cancelar) {
      const excluir = document.createElement('button');
      excluir.type = 'button';
      excluir.className = 'botao-excluir-linha';
      excluir.textContent = '×';
      excluir.title = atividade.tipo === 'TOPICO' ? 'Excluir tópico e itens internos' : 'Excluir item';
      excluir.setAttribute('aria-label', excluir.title);
      excluir.addEventListener('click', function () { excluirAtividadeInlineMapro(atividade); });
      cancelar.replaceWith(excluir);
    }
    const evidencia = linha.querySelector('.botao-anexar-evidencia');
    if (evidencia) {
      evidencia.disabled = false;
      evidencia.title = 'Anexar ou substituir evidência';
    }
    const historico = linha.querySelector('.botao-historico-atividade');
    if (historico) historico.disabled = atividade.tipo === 'TOPICO';
  }

  function sincronizarAgregadosTopicosNaTabelaMapro() {
    const atividades = estadoMapros.detalhe.atividades.concat(estadoMapros.rascunhosAtividades);
    atualizarAgregadosTopicosClienteMapro(atividades);
    atividades.filter(function (item) {
      return atividades.some(function (filha) { return filha.idAtividadePai === item.idAtividade; });
    }).forEach(function (topico) {
      const linha = document.querySelector('[data-atividade-id="' + topico.idAtividade + '"]');
      if (!linha) return;
      const inicio = linha.querySelector('[data-campo="dataInicio"]');
      const final = linha.querySelector('[data-campo="dataFinal"]');
      const situacao = linha.querySelector('[data-campo="status"]');
      const semanaInicio = linha.querySelector('.semana-inicio-atividade-mapro');
      const semanaFinal = linha.querySelector('.semana-final-atividade-mapro');
      const statusVisual = linha.querySelector('.bolinha-status');
      if (inicio) inicio.value = topico.dataInicio || '';
      if (final) final.value = topico.dataFinal || '';
      if (situacao && topico.tipo === 'TOPICO') situacao.value = topico.status || '';
      if (semanaInicio) semanaInicio.textContent = topico.semanaInicio || '—';
      if (semanaFinal) semanaFinal.textContent = topico.semanaFinal || '—';
      if (statusVisual) {
        statusVisual.className = 'bolinha-status status-' + String(topico.saude || 'VERDE').toLowerCase();
        statusVisual.title = descreverSaudeMapro(topico.saude || 'VERDE');
      }
    });
  }

  function anexarEvidenciaAtividadeMapro(atividade, arquivo, botao) {
    if (!arquivo) return;
    if (arquivo.size > 20 * 1024 * 1024) {
      mostrarAvisoMapros('A evidência deve possuir no máximo 20 MB.', true);
      return;
    }
    const textoOriginal = botao.textContent;
    botao.disabled = true;
    botao.textContent = '…';
    botao.setAttribute('aria-busy', 'true');
    const leitor = new FileReader();
    leitor.onerror = function () {
      botao.disabled = false;
      botao.textContent = textoOriginal;
      botao.removeAttribute('aria-busy');
      mostrarAvisoMapros('Não foi possível ler o arquivo selecionado.', true);
    };
    leitor.onload = function () {
      const conteudoBase64 = String(leitor.result || '').split(',')[1] || '';
      filaSalvamentoAtividadesMapro = filaSalvamentoAtividadesMapro.then(async function () {
        botao.textContent = '…';
        try {
          const resposta = await chamarServidorMapros('anexarEvidenciaAtividadeMapro', {
            idMapro: estadoMapros.detalhe.mapro.idMapro,
            idAtividade: atividade.idAtividade,
            version: atividade.version,
            nome: arquivo.name,
            tipo: arquivo.type || 'application/octet-stream',
            conteudoBase64: conteudoBase64
          });
          if (!resposta.sucesso) throw new Error(resposta.mensagem);
          Object.assign(atividade, resposta.dados || {});
          fecharModalMapros('modal-evidencia-atividade');
          estadoMapros.atividadeEvidenciaSelecionada = null;
          renderizarAtividadesMapro();
          mostrarAvisoMapros(resposta.mensagem);
        } catch (erro) {
          botao.disabled = false;
          botao.textContent = textoOriginal;
          botao.removeAttribute('aria-busy');
          mostrarAvisoMapros(erro.message, true);
        }
      });
    };
    leitor.readAsDataURL(arquivo);
  }

  function idsDescendentesAtividadeMapro(idAtividade) {
    const todos = (estadoMapros.detalhe.atividades || []).concat(estadoMapros.rascunhosAtividades || []);
    const ids = [idAtividade];
    for (let indice = 0; indice < ids.length; indice += 1) {
      todos.forEach(function (item) {
        if (item.idAtividadePai === ids[indice] && ids.indexOf(item.idAtividade) === -1) {
          ids.push(item.idAtividade);
        }
      });
    }
    return ids;
  }

  function excluirAtividadeInlineMapro(atividade) {
    if (!estadoMapros.modoEdicaoAtividades ||
        !estadoMapros.detalhe.permissao.podeEditarTudo) return;
    const ids = idsDescendentesAtividadeMapro(atividade.idAtividade);
    const removidas = estadoMapros.detalhe.atividades.filter(function (item) {
      return ids.indexOf(item.idAtividade) !== -1;
    }).map(function (item) { return Object.assign({}, item); });
    registrarAlteracaoDesfazerMapro({ tipo: 'exclusao', ids: ids.slice(), atividades: removidas });
    ids.forEach(function (id) { clearTimeout(temporizadoresAtividadesMapro[id]); });
    estadoMapros.detalhe.atividades = estadoMapros.detalhe.atividades.filter(function (item) {
      return ids.indexOf(item.idAtividade) === -1;
    });
    estadoMapros.rascunhosAtividades = estadoMapros.rascunhosAtividades.filter(function (item) {
      return ids.indexOf(item.idAtividade) === -1;
    });
    renderizarAtividadesMapro();
    filaSalvamentoAtividadesMapro = filaSalvamentoAtividadesMapro.then(async function () {
      try {
        const resposta = await chamarServidorMapros(
          'excluirAtividadeMapro',
          estadoMapros.detalhe.mapro.idMapro,
          atividade.idAtividade,
          atividade.version
        );
        if (!resposta.sucesso) throw new Error(resposta.mensagem);
        const resumo = resposta.dados && resposta.dados.resumoProjeto || {};
        if (resumo.version) {
          estadoMapros.detalhe.mapro.version = resumo.version;
          document.getElementById('mapro-version').value = resumo.version;
        }
        estadoMapros.detalhe.mapro.dataInicio = resumo.dataInicio || '';
        estadoMapros.detalhe.mapro.dataFinal = resumo.dataFinal || '';
        document.getElementById('mapro-data-inicio').value = resumo.dataInicio || '';
        document.getElementById('mapro-data-final').value = resumo.dataFinal || '';
        document.getElementById('mapro-semana-final').textContent = formatarSemanaMapros(resumo.dataFinal);
        mostrarAvisoMapros(resposta.mensagem);
      } catch (erro) {
        estadoMapros.historicoDesfazer.pop();
        atualizarBotaoDesfazerMapro();
        mostrarAvisoMapros(erro.message, true);
        await carregarDetalhesMapro(estadoMapros.detalhe.mapro.idMapro);
      }
    });
  }

  function registrarAlteracaoDesfazerMapro(alteracao) {
    estadoMapros.historicoDesfazer.push(alteracao);
    if (estadoMapros.historicoDesfazer.length > 30) estadoMapros.historicoDesfazer.shift();
    atualizarBotaoDesfazerMapro();
  }

  function atualizarBotaoDesfazerMapro() {
    const botao = document.getElementById('desfazer-atividade-mapro');
    const podeEditar = Boolean(estadoMapros.detalhe && estadoMapros.detalhe.permissao.podeEditarTudo);
    botao.disabled = !estadoMapros.modoEdicaoAtividades || !podeEditar ||
      !estadoMapros.historicoDesfazer.length;
  }

  function desfazerUltimaAlteracaoMapro() {
    const alteracao = estadoMapros.historicoDesfazer.pop();
    if (!alteracao) return;
    const botao = document.getElementById('desfazer-atividade-mapro');
    botao.disabled = true;
    if (alteracao.tipo === 'edicao') {
      const atividade = estadoMapros.detalhe.atividades.find(function (item) {
        return item.idAtividade === alteracao.idAtividade;
      });
      if (!atividade) {
        atualizarBotaoDesfazerMapro();
        return;
      }
      Object.assign(atividade, alteracao.anterior);
      atividade.replanejamentoPendente = false;
      renderizarAtividadesMapro();
      agendarSalvamentoAtividadeMapro(atividade, 0);
      atualizarBotaoDesfazerMapro();
      mostrarAvisoMapros('Alteração desfeita.');
      return;
    }
    const exclusao = alteracao;
    filaSalvamentoAtividadesMapro = filaSalvamentoAtividadesMapro.then(async function () {
      try {
        const resposta = await chamarServidorMapros(
          'restaurarAtividadesMapro', estadoMapros.detalhe.mapro.idMapro, exclusao.ids
        );
        if (!resposta.sucesso) throw new Error(resposta.mensagem);
        await carregarDetalhesMapro(estadoMapros.detalhe.mapro.idMapro);
        atualizarBotaoDesfazerMapro();
        mostrarAvisoMapros(resposta.mensagem);
      } catch (erro) {
        estadoMapros.historicoDesfazer.push(alteracao);
        botao.disabled = false;
        mostrarAvisoMapros(erro.message, true);
      }
    });
  }

  function abrirModalMoverAtividadeMapro(atividade) {
    if (!estadoMapros.modoEdicaoAtividades ||
        !estadoMapros.detalhe.permissao.podeEditarTudo) return;
    estadoMapros.atividadeSelecionada = atividade;
    document.getElementById('nome-atividade-mover-mapro').textContent = atividade.nomeAtividade;
    const select = document.getElementById('novo-pai-atividade-mapro');
    select.replaceChildren(criarOpcaoMapros('', 'Selecione o novo item superior'));
    const idsBloqueados = idsDescendentesAtividadeMapro(atividade.idAtividade);
    const candidatos = estadoMapros.detalhe.atividades.slice().sort(function (a, b) {
      return Number(a.ordem || 0) - Number(b.ordem || 0);
    }).filter(function (item) {
      if (idsBloqueados.indexOf(item.idAtividade) !== -1) return false;
      return atividade.tipo === 'ATIVIDADE'
        ? item.tipo === 'TOPICO'
        : item.tipo === 'ATIVIDADE' || item.tipo === 'SUBATIVIDADE';
    });
    candidatos.forEach(function (item) {
      const opcao = criarOpcaoMapros(item.idAtividade, item.nomeAtividade);
      select.appendChild(opcao);
    });
    select.value = atividade.idAtividadePai || '';
    abrirModalMapros('modal-mover-atividade-mapro');
  }

  function moverAtividadeSelecionadaMapro(evento) {
    evento.preventDefault();
    const atividade = estadoMapros.atividadeSelecionada;
    const idNovoPai = document.getElementById('novo-pai-atividade-mapro').value;
    if (!atividade || !idNovoPai) {
      mostrarAvisoMapros('Selecione o novo item superior.', true);
      return;
    }
    const botao = document.getElementById('confirmar-mover-atividade-mapro');
    botao.disabled = true;
    filaSalvamentoAtividadesMapro = filaSalvamentoAtividadesMapro.then(async function () {
      try {
        const resposta = await chamarServidorMapros(
          'moverAtividadeMapro',
          estadoMapros.detalhe.mapro.idMapro,
          atividade.idAtividade,
          idNovoPai,
          atividade.version
        );
        if (!resposta.sucesso) throw new Error(resposta.mensagem);
        Object.assign(atividade, resposta.dados && resposta.dados.atividade || {});
        const resumo = resposta.dados && resposta.dados.resumoProjeto || {};
        if (resumo.version) {
          estadoMapros.detalhe.mapro.version = resumo.version;
          document.getElementById('mapro-version').value = resumo.version;
        }
        fecharModalMapros('modal-mover-atividade-mapro');
        estadoMapros.atividadeSelecionada = null;

  async function salvarParticipantesMapro(evento) {
    evento.preventDefault();
    const participantes = Array.from(
      document.querySelectorAll('#lista-participantes-mapro input:checked')
    ).map(function (item) {
      return {
        id: item.value,
        papel: item.closest('.opcao-participante-mapro').querySelector('select').value
      };
    });
    if (!participantes.length) return mostrarAvisoMapros('Selecione ao menos um participante.', true);
    const botao = document.getElementById('salvar-participantes-mapro');
    botao.disabled = true;
    MaproUI.showLoading('Relacionando participante ao projeto...');
    try {
      const resposta = await chamarServidorMapros(
        'adicionarParticipantesMapro',
        estadoMapros.detalhe.mapro.idMapro,
        participantes
      );
      if (!resposta.sucesso) throw new Error(resposta.mensagem);
      const relacionados = resposta.dados && resposta.dados.participantes || [];
      relacionados.forEach(function (participante) {
        const indiceParticipante = estadoMapros.detalhe.participantes.findIndex(function (item) {
          return item.email === participante.email;
        });
        if (indiceParticipante === -1) estadoMapros.detalhe.participantes.push(participante);
        else estadoMapros.detalhe.participantes[indiceParticipante] = participante;
        const usuario = estadoMapros.detalhe.usuarios.find(function (item) {
          return String(item.id) === String(participante.id);
        });
        const podeSerResponsavel = ['EDITOR', 'OBSERVADOR'].indexOf(participante.papel) !== -1;
        const jaEstaNosResponsaveis = usuario && estadoMapros.detalhe.responsaveis.some(function (item) {
          return String(item.id) === String(usuario.id);
        });
        if (usuario && podeSerResponsavel && !jaEstaNosResponsaveis) {
          estadoMapros.detalhe.responsaveis.push(usuario);
        } else if (usuario && !podeSerResponsavel && jaEstaNosResponsaveis) {
          estadoMapros.detalhe.responsaveis = estadoMapros.detalhe.responsaveis.filter(function (item) {
            return String(item.id) !== String(usuario.id);
          });
        }
      });
      estadoMapros.detalhe.responsaveis.sort(function (a, b) {
        return a.nome.localeCompare(b.nome, 'pt-BR');
      });
      fecharModalMapros('modal-participantes-mapro');
      mostrarAvisoMapros(resposta.mensagem);
      renderizarAtividadesMapro();
    } catch (erro) {
      mostrarAvisoMapros(erro.message, true);
    } finally {
      MaproUI.hideLoading();
      botao.disabled = false;
    }
  }

  function aguardarComLimiteMapro(promessa, milissegundos) {
    return new Promise(function (resolve, reject) {
      const limite = window.setTimeout(function () {
        reject(new Error('O salvamento ainda está sendo concluído. Aguarde alguns segundos e tente novamente.'));
      }, milissegundos);
      Promise.resolve(promessa).then(function (resultado) {
        window.clearTimeout(limite);
        resolve(resultado);
      }, function (erro) {
        window.clearTimeout(limite);
        reject(erro);
      });
    });
  }

  async function aguardarAutosaveCabecalhoMapro() {
    const iniciadoEm = Date.now();
    const limiteEspera = 8000;
    if (estadoMapros.detalhe) {
      (estadoMapros.detalhe.atividades || []).concat(estadoMapros.rascunhosAtividades || [])
        .forEach(function (atividade) {
          clearTimeout(temporizadoresAtividadesMapro[atividade.idAtividade]);
        });
      await aguardarComLimiteMapro(
        Promise.all([filaSalvamentoAtividadesMapro, filaMovimentosAtividadesMapro]), limiteEspera
      );
    }
    clearTimeout(temporizadorAutosaveMapro);
    if (autosaveMaproPendente && !autosaveMaproEmAndamento && !atividadeMaproEmSalvamento) {
      const restante = Math.max(1, limiteEspera - (Date.now() - iniciadoEm));
      await aguardarComLimiteMapro(executarAutosaveMapro(), restante);
    }
    while (autosaveMaproEmAndamento || atividadeMaproEmSalvamento) {
      if (Date.now() - iniciadoEm >= limiteEspera) {
        throw new Error('O salvamento ainda está sendo concluído. Aguarde alguns segundos e tente novamente.');
      }
      await new Promise(function (resolve) { setTimeout(resolve, 50); });
    }
  }

  async function imprimirProjetoMapro() {
    const botao = document.getElementById('imprimir-pdf-mapro');
    botao.disabled = true;
    MaproUI.showLoading('Gerando PDF...');
    await aguardarPinturaMapros();
    try {
      const mapro = estadoMapros.detalhe.mapro;
      const origem = document.getElementById('conteudo-detalhe-mapro');
      const copia = origem.cloneNode(true);
      const controlesOriginais = origem.querySelectorAll('input, select, textarea');
      const controlesCopia = copia.querySelectorAll('input, select, textarea');
      controlesOriginais.forEach(function (controle, indice) {
        const clone = controlesCopia[indice];
        if (!clone) return;
        if (controle.tagName === 'SELECT') {
          Array.from(clone.options).forEach(function (opcao, indiceOpcao) {
            opcao.selected = indiceOpcao === controle.selectedIndex;
          });
          return;
        }
        if (controle.tagName === 'TEXTAREA') {
          clone.textContent = controle.value;
          return;
        }
        if (controle.type !== 'file') clone.setAttribute('value', controle.value);
      });
      copia.querySelectorAll('.fundo-modal, .acoes-formulario-mapros').forEach(function (elemento) {
        elemento.remove();
      });
      const resposta = await chamarServidorMapros('gerarPdfProjetoMapro', mapro.idMapro, copia.outerHTML);
      if (!resposta.sucesso) throw new Error(resposta.mensagem);
      const dados = resposta.dados || {};
      const binario = window.atob(String(dados.conteudoBase64 || ''));
      const bytes = new Uint8Array(binario.length);
      for (let indice = 0; indice < binario.length; indice += 1) {
        bytes[indice] = binario.charCodeAt(indice);
      }
      const url = URL.createObjectURL(new Blob([bytes], { type: dados.tipo || 'application/pdf' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = dados.nome || 'MAPRO.pdf';
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      mostrarAvisoMapros(resposta.mensagem || 'PDF baixado com sucesso.');
    } catch (erro) {
      mostrarAvisoMapros(erro.message || 'Não foi possível preparar o documento.', true);
    } finally {
      MaproUI.hideLoading();
      botao.disabled = false;
    }
  }

  function formatarDataMapros(valor) {
    if (!valor) return '—';
    const partes = valor.split('-');
    return partes.length === 3 ? partes[2] + '/' + partes[1] + '/' + partes[0] : valor;
  }

  function formatarDataHoraMapros(valor) {
    if (!valor) return '—';
    const data = new Date(valor);
    return Number.isNaN(data.getTime()) ? String(valor) : data.toLocaleString('pt-BR');
  }

  function formatarSituacaoAtividadeMapro(valor) {
    const mapa = {
      PLANEJADA: 'Planejada', EM_ANDAMENTO: 'Em andamento',
      CONCLUIDA: 'Concluída', NAO_APLICAVEL: 'Não aplicável'
    };
    return mapa[valor] || valor;
  }

  function descreverSaudeMapro(valor) {
    const mapa = {
      AZUL: 'Concluída', VERMELHO: 'Fora do prazo', VERDE: 'No prazo',
      AMARELO: 'Prazo próximo ao vencimento', CINZA: 'Não aplicável'
    };
    return mapa[valor] || valor;
  }

  function camposNavegaveisAtividadesMapro(raiz) {
    return Array.from((raiz || document).querySelectorAll('[data-campo]:not(:disabled)'))
      .filter(function (campo) { return campo.offsetParent !== null; });
  }

  function focarCampoAtividadeMapro(campo) {
    if (!campo) return;
    campo.focus();
    if ((campo.tagName === 'TEXTAREA' ||
        (campo.tagName === 'INPUT' && ['text', 'search', 'email', 'tel', 'url']
          .indexOf(campo.type) !== -1)) && typeof campo.select === 'function') {
      campo.select();
    }
  }

  function campoMesmaColunaAtividadeMapro(campoAtual, deslocamentoLinha) {
    const linhaAtual = campoAtual.closest('tr[data-atividade-id]');
    if (!linhaAtual) return null;
    const linhas = Array.from(document.querySelectorAll(
      '#corpo-atividades-mapro tr[data-atividade-id]'
    )).filter(function (linha) { return linha.offsetParent !== null; });
    const indiceAtual = linhas.indexOf(linhaAtual);
    for (let indice = indiceAtual + deslocamentoLinha;
        indice >= 0 && indice < linhas.length;
        indice += deslocamentoLinha) {
      const candidato = camposNavegaveisAtividadesMapro(linhas[indice]).find(function (campo) {
        return campo.dataset.campo === campoAtual.dataset.campo;
      });
      if (candidato) return candidato;
    }
    return null;
  }

  function navegarCamposAtividadesMapro(evento) {
    if (evento.ctrlKey || evento.altKey || evento.metaKey) return;
    const campoAtual = evento.target.closest('[data-campo]');
    if (!campoAtual || campoAtual.disabled) return;
    const teclasPermitidas = ['Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
    if (teclasPermitidas.indexOf(evento.key) === -1) return;

    let destino = null;
    if (evento.key === 'ArrowUp' || evento.key === 'ArrowDown') {
      destino = campoMesmaColunaAtividadeMapro(
        campoAtual, evento.key === 'ArrowUp' ? -1 : 1
      );
    } else if (evento.key === 'ArrowLeft') {
      const linha = campoAtual.closest('tr[data-atividade-id]');
      const camposLinha = camposNavegaveisAtividadesMapro(linha);
      destino = camposLinha[camposLinha.indexOf(campoAtual) - 1] || null;
    } else {
      const campos = camposNavegaveisAtividadesMapro(
        document.getElementById('corpo-atividades-mapro')
      );
      const deslocamento = evento.key === 'Enter' && evento.shiftKey ? -1 : 1;
      destino = campos[campos.indexOf(campoAtual) + deslocamento] || null;
    }

    if (evento.key === 'Enter' || destino) evento.preventDefault();
    if (!destino) return;
    campoAtual.dispatchEvent(new Event('change', { bubbles: true }));
    focarCampoAtividadeMapro(destino);
  }

    } catch (erro) {
      MaproUI.hideLoading();
      mostrarAvisoMapros(erro.message, true);
    }
  });
  document.getElementById('abrir-mapro').addEventListener('click', abrirProjetoSelecionado);
  document.getElementById('alternar-painel-portfolios')
    .addEventListener('click', alternarPainelPortfolios);
  document.getElementById('verificar-inatividade').addEventListener('click', abrirConfirmacaoInatividadeMapros);
  document.getElementById('abrir-pesquisa-mapros').addEventListener('click', abrirPesquisaMapros);
  document.getElementById('limpar-pesquisa-mapros').addEventListener('click', limparPesquisaMapros);
  document.getElementById('formulario-pesquisa-mapros').addEventListener('submit', pesquisarMapros);
  document.getElementById('confirmar-inatividade-mapros')
    .addEventListener('click', verificarInatividadePaginaMapros);
  document.getElementById('voltar-lista-mapros').addEventListener('click', voltarParaListaMapros);
  document.getElementById('imprimir-pdf-mapro').addEventListener('click', imprimirProjetoMapro);
  const formularioCabecalhoMapro = document.getElementById('formulario-cabecalho-mapro');
  formularioCabecalhoMapro.addEventListener('submit', salvarCabecalhoProjeto);
  formularioCabecalhoMapro.addEventListener('input', function (evento) {
    if (evento.target.matches('input:not([readonly]):not([type="file"]), textarea')) {
      agendarAutosaveMapro(300);
    }
  });
  formularioCabecalhoMapro.addEventListener('change', function (evento) {
    if (evento.target.matches('input:not([readonly]):not([type="file"]), select, textarea')) {
      agendarAutosaveMapro(80);
    }
  });
  formularioCabecalhoMapro.addEventListener('focusout', function (evento) {
    if (evento.target.matches('input:not([readonly]):not([type="file"]), select, textarea')) {
      agendarAutosaveMapro(0);
    }
  });
  document.getElementById('mapro-nome').addEventListener('input', function () {
    this.value = this.value.toLocaleUpperCase('pt-BR');
  });
  document.getElementById('mapro-negocio').addEventListener('change', function () {
    atualizarDimensoesMapro('', '');
  });
  document.getElementById('mapro-dimensao').addEventListener('change', function () {
    atualizarObjetivosMapro('');
  });
  document.getElementById('mapro-objetivo').addEventListener('change', function () {
    atualizarObjetivosMapro(this.value);
  });
  document.getElementById('mapro-lider').addEventListener('change', atualizarEmailLiderMapro);
  document.querySelectorAll('input[name="mapro-envolve-sistema"]').forEach(function (campo) {
    campo.addEventListener('change', atualizarCampoSistemasMapro);
  });
  document.getElementById('informacao-cabecalho-mapro').addEventListener('click', function () {
    abrirModalMapros('modal-informacao-cabecalho-mapro');
    document.querySelector('#modal-informacao-cabecalho-mapro .fechar-modal').focus();
  });
  document.getElementById('informacao-corpo-projeto-mapro').addEventListener('click', function () {
    abrirModalMapros('modal-legenda-corpo-projeto-mapro');
    document.querySelector('#modal-legenda-corpo-projeto-mapro .fechar-modal').focus();
  });
  document.getElementById('baixar-bsc-mapro').addEventListener('click', baixarBscMapro);
  document.getElementById('historico-prazo-projeto-mapro')
    .addEventListener('click', abrirHistoricoPrazoProjetoMapro);
  document.getElementById('acionador-foto-lider').addEventListener('click', function () {
    document.getElementById('arquivo-foto-lider').click();
  });
  document.getElementById('arquivo-foto-lider').addEventListener('change', function () {
    salvarFotoLiderMapro(this.files && this.files[0]);
  });
  document.getElementById('remover-foto-lider').addEventListener('click', function (evento) {
    evento.stopPropagation();
    removerFotoLiderMapro();
  });
  document.getElementById('nova-atividade-raiz-mapro').addEventListener('click', function () {
    adicionarRascunhoAtividadeMapro('');
  });
  document.getElementById('desfazer-atividade-mapro').addEventListener('click', desfazerUltimaAlteracaoMapro);
  document.getElementById('editar-atividades-mapro').addEventListener('click', habilitarEdicaoAtividadesMapro);
  document.getElementById('salvar-prazos-mapro').addEventListener('click', salvarEdicoesAtividadesMapro);
  document.getElementById('iniciar-acompanhamento-mapro')
    .addEventListener('click', abrirConfirmacaoAcompanhamentoMapro);
  document.getElementById('confirmar-iniciar-acompanhamento')
    .addEventListener('click', confirmarInicioAcompanhamentoMapro);
  document.getElementById('confirmar-evidencia-modal-mapro').addEventListener('click', function () {
    const atividade = estadoMapros.atividadeEvidenciaSelecionada;
    const arquivo = document.getElementById('arquivo-evidencia-modal-mapro').files[0];
    if (!atividade || !arquivo) {
      mostrarAvisoMapros('Selecione um arquivo para anexar.', true);
      return;
    }
    anexarEvidenciaAtividadeMapro(atividade, arquivo, this);
  });
  document.getElementById('adicionar-participantes-mapro').addEventListener('click', abrirModalParticipantesMapro);
  document.getElementById('informacao-permissoes-participantes-mapro').addEventListener('click', function () {
    abrirModalMapros('modal-informacao-permissoes-participantes-mapro');
  });
  document.getElementById('formulario-participantes-mapro').addEventListener('submit', salvarParticipantesMapro);
  document.getElementById('corpo-atividades-mapro')
    .addEventListener('keydown', navegarCamposAtividadesMapro);
  window.addEventListener('scroll', agendarCabecalhoFixoAtividadesMapro, { passive: true });
  window.addEventListener('resize', agendarCabecalhoFixoAtividadesMapro);
  document.getElementById('tabela-atividades-container')
    .addEventListener('scroll', agendarCabecalhoFixoAtividadesMapro, { passive: true });
  if ('ResizeObserver' in window) {
    const observadorCabecalhoFixo = new ResizeObserver(agendarCabecalhoFixoAtividadesMapro);
    observadorCabecalhoFixo.observe(document.getElementById('tabela-atividades-container'));
    observadorCabecalhoFixo.observe(document.querySelector('.tabela-atividades-mapro'));
    observadorCabecalhoFixo.observe(document.querySelector('.barra-detalhe-mapro'));
  }
  document.getElementById('pesquisa-participante-mapro').addEventListener('input', function () {
    const termo = this.value.trim().toLocaleLowerCase('pt-BR');
    document.querySelectorAll('.opcao-participante-mapro').forEach(function (item) {
      item.hidden = Boolean(termo) && item.textContent.toLocaleLowerCase('pt-BR').indexOf(termo) === -1;
    });
  });
  document.querySelectorAll('[data-fechar-modal]').forEach(function (botao) {
    botao.addEventListener('click', function () { fecharModalMapros(botao.dataset.fecharModal); });
  });
  document.querySelectorAll('.fundo-modal').forEach(function (fundo) {
    fundo.addEventListener('click', function (evento) {
      if (evento.target === fundo) fecharModalMapros(fundo.id);
    });
  });
  document.addEventListener('click', function () {
    document.querySelectorAll('.opcoes-mais-atividade').forEach(function (menu) { menu.hidden = true; });
  });
  iniciarPaginaMapros();
</script>
