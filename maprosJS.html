<script>
  const estadoMapros = {
    pagina: null,
    portfolio: '',
    mapros: [],
    todasMapros: [],
    listaInicialCarregada: false,
    filtros: {},
    portfoliosRecolhidos: false,
    maproSelecionada: null,
    detalhe: null,
    atividadeSelecionada: null,
    atividadeEvidenciaSelecionada: null,
    atividadeArrastada: null,
    nosRecolhidos: {},
    historicoDesfazer: [],
    maproHistoricoId: '',
    rascunhosAtividades: [],
    modoEdicaoAtividades: false,
    idsAtividadesEditadas: {},
    salvandoEdicoesAtividades: false,
    sequenciaLista: 0,
    maproLinkProcessado: false,
    movimentosPendentes: {}
  };
  let tempoAvisoMapros;
  let temporizadorAutosaveMapro;
  let autosaveMaproEmAndamento = false;
  let autosaveMaproPendente = false;
  let assinaturaCabecalhoMaproSalva = '';
  const temporizadoresAtividadesMapro = {};
  let filaSalvamentoAtividadesMapro = Promise.resolve();
  let filaMovimentosAtividadesMapro = Promise.resolve();
  let atividadeMaproEmSalvamento = false;
  let quadroCabecalhoFixoAtividadesMapro = 0;

  function chamarServidorMapros(nome, ...argumentos) {
    return new Promise(function (resolve, reject) {
      const executor = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function () {
          reject(new Error('Falha de comunicação com o servidor.'));
        });
      executor[nome](...argumentos);
    });
  }

  function mostrarAvisoMapros(mensagem, falha) {
    const aviso = document.getElementById('aviso');
    clearTimeout(tempoAvisoMapros);
    aviso.textContent = mensagem;
    aviso.classList.toggle('falha', Boolean(falha));
    aviso.hidden = false;
    tempoAvisoMapros = setTimeout(function () { aviso.hidden = true; }, 5500);
  }

  async function iniciarPaginaMapros() {
    MaproUI.showLoading('Carregando projetos...');
    try {
      const inicial = MaproUI.readInitialData();
      const pacoteInicial = inicial && inicial.pagina === 'mapros' && inicial.configuracao
        ? { configuracao: inicial.configuracao, mapros: inicial.mapros }
        : await chamarServidorMapros('carregarPaginaMaprosInicial');
      const resposta = pacoteInicial.configuracao;
      if (!resposta.sucesso) throw new Error(resposta.mensagem);
      estadoMapros.pagina = resposta.dados;
      document.getElementById('logo-rodape-mapros').src = resposta.dados.logoEmpresaUrl;
      restaurarPainelPortfolios();
      document.getElementById('titulo-pagina-mapros').textContent = resposta.dados.titulo;
      document.getElementById('verificar-inatividade').hidden = !resposta.dados.admin;
      renderizarMenuPortfolios();
      if (pacoteInicial.mapros) {
        aplicarRespostaListaMapros(pacoteInicial.mapros, '');
      } else {
        await carregarListaMapros('', true);
      }
    } catch (erro) {
      MaproUI.hideLoading();
      const estado = document.getElementById('estado-mapros');
      estado.textContent = erro.message;
      estado.classList.add('estado-tabela-erro');
    }
  }

  function renderizarMenuPortfolios() {
    const menu = document.getElementById('menu-portfolios');
    menu.replaceChildren();
    const opcoes = [{ valor: '', texto: 'TODOS OS PORTFÓLIOS' }].concat(
      estadoMapros.pagina.portfolios.map(function (portfolio) {
        return { valor: portfolio, texto: portfolio };
      })
    );
    opcoes.forEach(function (opcao) {
      const botao = document.createElement('button');
      botao.type = 'button';
      botao.className = 'botao-portfolio';
      botao.textContent = opcao.texto;
      botao.classList.toggle('ativo', opcao.valor === estadoMapros.portfolio);
      botao.addEventListener('click', async function () {
        estadoMapros.portfolio = opcao.valor;
        renderizarMenuPortfolios();
        await carregarListaMapros(opcao.valor, false);
      });
      menu.appendChild(botao);
    });
  }

  function restaurarPainelPortfolios() {
    let recolhido = false;
    try {
      recolhido = localStorage.getItem('mapro:painel-portfolios-recolhido') === 'sim';
    } catch (erro) {
      recolhido = false;
    }
    atualizarPainelPortfolios(recolhido);
  }

  function alternarPainelPortfolios() {
    atualizarPainelPortfolios(!estadoMapros.portfoliosRecolhidos);
    try {
      localStorage.setItem(
        'mapro:painel-portfolios-recolhido',
        estadoMapros.portfoliosRecolhidos ? 'sim' : 'nao'
      );
    } catch (erro) {
      // A preferência é apenas visual; a navegação continua funcionando sem armazenamento local.
    }
  }

  function atualizarPainelPortfolios(recolhido) {
    estadoMapros.portfoliosRecolhidos = Boolean(recolhido);
    const layout = document.getElementById('layout-lista-mapros');
    const botao = document.getElementById('alternar-painel-portfolios');
    layout.classList.toggle('portfolios-recolhidos', estadoMapros.portfoliosRecolhidos);
    botao.setAttribute('aria-expanded', String(!estadoMapros.portfoliosRecolhidos));
    botao.setAttribute(
      'aria-label',
      estadoMapros.portfoliosRecolhidos
        ? 'Expandir menu de portfólios'
        : 'Recolher menu de portfólios'
    );
    botao.title = estadoMapros.portfoliosRecolhidos
      ? 'Expandir menu de portfólios'
      : 'Recolher menu de portfólios';
  }

  async function carregarListaMapros(portfolio, forcarServidor) {
    const sequencia = ++estadoMapros.sequenciaLista;
    const estado = document.getElementById('estado-mapros');
    const tabela = document.getElementById('tabela-mapros-container');
    estado.hidden = false;
    estado.textContent = 'Carregando projetos...';
    tabela.hidden = true;
    estadoMapros.maproSelecionada = null;
    document.getElementById('abrir-mapro').disabled = true;
    if (estadoMapros.listaInicialCarregada && !forcarServidor) {
      estadoMapros.mapros = filtrarMaprosPagina(portfolio);
      renderizarTabelaMapros();
      return;
    }
    MaproUI.showLoading('Carregando projetos...');
    try {
      const resposta = await chamarServidorMapros('listarMaprosPagina', '');
      if (sequencia !== estadoMapros.sequenciaLista) return;
      aplicarRespostaListaMapros(resposta, portfolio);
    } catch (erro) {
      MaproUI.hideLoading();
      estado.textContent = erro.message;
      estado.classList.add('estado-tabela-erro');
    }
  }

  function aplicarRespostaListaMapros(resposta, portfolio) {
    MaproUI.hideLoading();
    if (!resposta.sucesso) throw new Error(resposta.mensagem);
    estadoMapros.todasMapros = resposta.dados || [];
    estadoMapros.listaInicialCarregada = true;
    estadoMapros.mapros = filtrarMaprosPagina(portfolio);
    renderizarTabelaMapros();
    abrirMaproRecebidaPorLink();
  }

  function abrirMaproRecebidaPorLink() {
    if (estadoMapros.maproLinkProcessado) return;
    const idRecebido = new URLSearchParams(window.location.search).get('mapro');
    if (!idRecebido) return;
    estadoMapros.maproLinkProcessado = true;
    const normalizarId = function (valor) {
      return String(valor || '').trim().replace(/^0+/, '') || '0';
    };
    const mapro = estadoMapros.todasMapros.find(function (item) {
      return normalizarId(item.idMapro) === normalizarId(idRecebido);
    });
    if (!mapro) {
      mostrarAvisoMapros(
        'Esta Mapro não está disponível para a conta Google usada neste acesso. Verifique a conta conectada.',
        true
      );
      return;
    }
    estadoMapros.maproSelecionada = mapro;
    window.setTimeout(function () { abrirProjetoSelecionado(); }, 0);
  }

  function filtrarMaprosPagina(portfolio) {
    const filtros = estadoMapros.filtros || {};
    const normalizar = function (valor) {
      return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLocaleLowerCase('pt-BR').trim();
    };
    const idFiltro = String(filtros.id || '').trim().replace(/^0+/, '') || '';
    const nomeFiltro = normalizar(filtros.nome);
    const statusFiltro = normalizar(filtros.status);
    return estadoMapros.todasMapros.filter(function (mapro) {
      const idMapro = String(mapro.idMapro || '').replace(/^0+/, '') || '0';
      return (!portfolio || mapro.portfolio === portfolio) &&
        (!idFiltro || idMapro === idFiltro) &&
        (!nomeFiltro || normalizar(mapro.nomeProjeto).indexOf(nomeFiltro) !== -1) &&
        (!statusFiltro || normalizar(mapro.situacao) === statusFiltro) &&
        (!filtros.dataInicio || mapro.dataInicio === filtros.dataInicio) &&
        (!filtros.dataFinal || mapro.dataFinal === filtros.dataFinal);
    });
  }

  function abrirPesquisaMapros() {
    const filtros = estadoMapros.filtros || {};
    document.getElementById('filtro-mapro-id').value = filtros.id || '';
    document.getElementById('filtro-mapro-nome').value = filtros.nome || '';
    document.getElementById('filtro-mapro-status').value = filtros.status || '';
    document.getElementById('filtro-mapro-data-inicio').value = filtros.dataInicio || '';
    document.getElementById('filtro-mapro-data-final').value = filtros.dataFinal || '';
    abrirModalMapros('modal-pesquisa-mapros');
    document.getElementById('filtro-mapro-id').focus();
  }

  function pesquisarMapros(evento) {
    evento.preventDefault();
    estadoMapros.filtros = {
      id: document.getElementById('filtro-mapro-id').value.trim(),
      nome: document.getElementById('filtro-mapro-nome').value.trim(),
      status: document.getElementById('filtro-mapro-status').value,
      dataInicio: document.getElementById('filtro-mapro-data-inicio').value,
      dataFinal: document.getElementById('filtro-mapro-data-final').value
    };
    fecharModalMapros('modal-pesquisa-mapros');
    carregarListaMapros(estadoMapros.portfolio, false);
  }

  function limparPesquisaMapros() {
    estadoMapros.filtros = {};
    document.getElementById('formulario-pesquisa-mapros').reset();
    carregarListaMapros(estadoMapros.portfolio, false);
    mostrarAvisoMapros('Filtros removidos.');
  }

  function renderizarTabelaMapros() {
    const corpo = document.getElementById('corpo-tabela-mapros');
    const estado = document.getElementById('estado-mapros');
    const tabela = document.getElementById('tabela-mapros-container');
    corpo.replaceChildren();
    if (!estadoMapros.mapros.length) {
      estado.hidden = false;
      estado.textContent = 'Nenhuma Mapro foi encontrada neste portfólio.';
      tabela.hidden = true;
      return;
    }
    estadoMapros.mapros.forEach(function (mapro) {
      const linha = document.createElement('tr');
      linha.tabIndex = 0;
      adicionarCelulaMapros(linha, mapro.idMapro);
      const celulaStatus = document.createElement('td');
      celulaStatus.className = 'celula-status-mapros';
      const bolinha = document.createElement('span');
      bolinha.className = 'bolinha-status status-' + mapro.saude.toLowerCase();
      bolinha.title = descreverSaudeMapro(mapro.saude);
      celulaStatus.appendChild(bolinha);
      linha.appendChild(celulaStatus);
      adicionarCelulaMapros(linha, mapro.contagiro);
      adicionarCelulaMapros(linha, mapro.nomeProjeto);
      adicionarCelulaMapros(linha, formatarDataMapros(mapro.dataInicio));
      adicionarCelulaMapros(linha, formatarDataMapros(mapro.dataFinal));
      const celulaProgresso = document.createElement('td');
      const barra = document.createElement('div');
      barra.className = 'barra-progresso';
      const preenchimento = document.createElement('span');
      preenchimento.style.width = mapro.percentualConclusao + '%';
      const percentual = document.createElement('strong');
      percentual.textContent = mapro.percentualConclusao + '%';
      barra.append(preenchimento, percentual);
      celulaProgresso.appendChild(barra);
      linha.appendChild(celulaProgresso);
      adicionarCelulaMapros(linha, mapro.situacao);
      const selecionar = function () {
        estadoMapros.maproSelecionada = mapro;
        document.querySelectorAll('.tabela-mapros tbody tr').forEach(function (item) {
          item.classList.toggle('linha-selecionada', item === linha);
        });
        document.getElementById('abrir-mapro').disabled = false;
      };
      linha.addEventListener('click', selecionar);
      linha.addEventListener('dblclick', function () { selecionar(); abrirProjetoSelecionado(); });
      linha.addEventListener('keydown', function (evento) {
        if (evento.key === 'Enter') { selecionar(); abrirProjetoSelecionado(); }
      });
      corpo.appendChild(linha);
    });
    estado.hidden = true;
    tabela.hidden = false;
  }

  function adicionarCelulaMapros(linha, valor) {
    const celula = document.createElement('td');
    celula.textContent = String(valor || '—');
    linha.appendChild(celula);
  }

  async function abrirProjetoSelecionado() {
    if (!estadoMapros.maproSelecionada) {
      return mostrarAvisoMapros('Selecione uma Mapro para abrir.', true);
    }
    document.getElementById('etapa-lista-mapros').hidden = true;
    document.getElementById('etapa-detalhe-mapro').hidden = false;
    document.getElementById('rodape-projeto-mapros').hidden = false;
    document.getElementById('carregando-detalhe-mapro').hidden = false;
    document.getElementById('conteudo-detalhe-mapro').hidden = true;
    try {
      await carregarDetalhesMapro(estadoMapros.maproSelecionada.idMapro);
    } catch (erro) {
      mostrarAvisoMapros(erro.message, true);
      voltarParaListaMapros();
    }
  }

  async function carregarDetalhesMapro(idMapro) {
    clearTimeout(temporizadorAutosaveMapro);
    autosaveMaproPendente = false;
    MaproUI.showLoading('Carregando projeto...');
    try {
      const resposta = await chamarServidorMapros('obterDetalhesMapro', idMapro);
      if (!resposta.sucesso) throw new Error(resposta.mensagem);
      const mudouProjeto = String(estadoMapros.maproHistoricoId || '') !== String(idMapro);
      estadoMapros.detalhe = resposta.dados;
      sincronizarDepartamentosCadastradosMapro();
      (estadoMapros.detalhe.atividades || []).forEach(function (atividade) {
        atividade.assinaturaSalva = assinaturaAtividadeMapro(atividade);
      });
      estadoMapros.atividadeSelecionada = null;
      estadoMapros.atividadeEvidenciaSelecionada = null;
      estadoMapros.atividadeArrastada = null;
      estadoMapros.movimentosPendentes = {};
      estadoMapros.nosRecolhidos = {};
      if (mudouProjeto) estadoMapros.historicoDesfazer = [];
      estadoMapros.maproHistoricoId = String(idMapro);
      estadoMapros.rascunhosAtividades = [];
      estadoMapros.modoEdicaoAtividades = false;
      estadoMapros.idsAtividadesEditadas = {};
      estadoMapros.salvandoEdicoesAtividades = false;
      preencherCabecalhoMapro();
      assinaturaCabecalhoMaproSalva = assinaturaCabecalhoMapro(
        obterDadosCabecalhoMapro()
      );
      aplicarPermissoesProjetoMapro();
      atualizarEstadoAutosaveMapro('Cabeçalho salvo automaticamente', '');
      renderizarAtividadesMapro();
      document.getElementById('adicionar-participantes-mapro').hidden =
        !resposta.dados.podeGerenciarParticipantes;
      document.getElementById('carregando-detalhe-mapro').hidden = true;
      document.getElementById('conteudo-detalhe-mapro').hidden = false;
      agendarCabecalhoFixoAtividadesMapro();
    } finally {
      MaproUI.hideLoading();
    }
  }

  function sincronizarDepartamentosCadastradosMapro() {
    const detalhe = estadoMapros.detalhe || {};
    const usuarios = detalhe.usuarios || [];
    const responsaveis = detalhe.responsaveis || [];
    const mapro = detalhe.mapro || {};
    const lider = usuarios.find(function (usuario) {
      return String(usuario.id) === String(mapro.idLider) ||
        String(usuario.email || '').toLowerCase() === String(mapro.emailLider || '').toLowerCase();
    });
    if (lider) mapro.departamento = lider.departamento || '';
    (detalhe.atividades || []).forEach(function (atividade) {
      const responsavel = responsaveis.find(function (usuario) {
        return String(usuario.id) === String(atividade.idResponsavel);
      });
      if (responsavel) atividade.departamento = responsavel.departamento || '';
      else if (atividade.idResponsavel) atividade.departamento = '';
    });
  }

  function preencherCabecalhoMapro() {
    const mapro = estadoMapros.detalhe.mapro;
    document.getElementById('mapro-id').value = mapro.idMapro;
    document.getElementById('mapro-version').value = mapro.version;
    document.getElementById('id-visivel-mapro').textContent = mapro.idMapro;
    document.getElementById('mapro-nome').value = mapro.nomeProjeto;
    document.getElementById('mapro-o-que-e').value = mapro.oQueE;
    document.getElementById('mapro-porque').value = mapro.porque;
    document.getElementById('mapro-resultados').value = mapro.resultadosEsperados;
    document.getElementById('mapro-nivel').value = mapro.nivel;
    document.getElementById('mapro-data-inicio').value = mapro.dataInicio;
    document.getElementById('mapro-data-final').value = mapro.dataFinal;
    document.getElementById('mapro-semana-final').textContent = formatarSemanaMapros(mapro.dataFinal);
    preencherLideresMapro(mapro);
    document.getElementById('mapro-email-lider').value = mapro.emailLider;
    document.getElementById('mapro-indicadores').value = mapro.indicadores;
    selecionarRadioMapro('mapro-processo-critico', mapro.processoCritico);
    selecionarRadioMapro('mapro-envolve-sistema', mapro.envolveSistema);
    document.getElementById('mapro-sistemas-envolvidos').value = mapro.sistemasEnvolvidos || '';
    atualizarCampoSistemasMapro();
    document.getElementById('portfolio-detalhe-mapro').textContent = mapro.portfolio;
    document.getElementById('situacao-detalhe-mapro').textContent = mapro.situacao;
    exibirFotoLiderMapro(mapro.fotoLider || '');
    preencherSelectMapros('mapro-contagiro', estadoMapros.detalhe.bases.contagiros, mapro.contagiro);
    preencherSelectMapros(
      'mapro-departamento',
      estadoMapros.detalhe.bases.departamentos,
      mapro.departamento
    );
    preencherEstrategiaMapro(mapro);
  }

  function aplicarPermissoesProjetoMapro() {
    const permissao = estadoMapros.detalhe.permissao || {};
    const podeEditarTudo = Boolean(permissao.podeEditarTudo);
    document.querySelectorAll(
      '#formulario-cabecalho-mapro input:not([type="hidden"]), ' +
      '#formulario-cabecalho-mapro select, #formulario-cabecalho-mapro textarea'
    ).forEach(function (controle) {
      if (!controle.readOnly) controle.disabled = !podeEditarTudo;
    });
    atualizarEstadoModoEdicaoAtividadesMapro();
    atualizarBotaoSalvarPrazosMapro();
    const iniciarAcompanhamento = document.getElementById('iniciar-acompanhamento-mapro');
    iniciarAcompanhamento.hidden = Boolean(estadoMapros.detalhe.mapro.acompanhamentoIniciado);
    iniciarAcompanhamento.disabled = !permissao.podeIniciarAcompanhamento;
    iniciarAcompanhamento.title = permissao.podeIniciarAcompanhamento
      ? 'Iniciar o acompanhamento do projeto'
      : 'Somente o ADMIN ou participantes Editores podem iniciar o acompanhamento';
    document.getElementById('acionador-foto-lider').disabled = !podeEditarTudo;
    document.getElementById('remover-foto-lider').disabled = !podeEditarTudo;
    document.getElementById('mapro-departamento').disabled = true;
  }

  function usuarioPodeEditarTabelaAtividadesMapro() {
    const permissao = estadoMapros.detalhe && estadoMapros.detalhe.permissao || {};
    return Boolean(permissao.podeEditarTudo || permissao.podeEditarProprias);
  }

  function atualizarEstadoModoEdicaoAtividadesMapro() {
    if (!estadoMapros.detalhe) return;
    const permissao = estadoMapros.detalhe.permissao || {};
    const podeEditar = usuarioPodeEditarTabelaAtividadesMapro();
    const modoAtivo = podeEditar && Boolean(estadoMapros.modoEdicaoAtividades);
    const estrutura = document.querySelector('.estrutura-corpo-projeto-mapro');
    const editar = document.getElementById('editar-atividades-mapro');
    const salvar = document.getElementById('salvar-prazos-mapro');
    const criarTopico = document.getElementById('nova-atividade-raiz-mapro');
    if (estrutura) estrutura.classList.toggle('modo-edicao-ativo', modoAtivo);
    editar.disabled = !podeEditar || modoAtivo;
    editar.classList.toggle('ativo', modoAtivo);
    editar.setAttribute('aria-pressed', modoAtivo ? 'true' : 'false');
    salvar.disabled = !modoAtivo;
    criarTopico.disabled = !modoAtivo || !permissao.podeEditarTudo;
    atualizarBotaoDesfazerMapro();
  }

  function habilitarEdicaoAtividadesMapro() {
    if (!usuarioPodeEditarTabelaAtividadesMapro()) {
      mostrarAvisoMapros('Você não possui permissão para editar as atividades desta MAPRO.', true);
      return;
    }
    estadoMapros.modoEdicaoAtividades = true;
    renderizarAtividadesMapro();
    atualizarEstadoModoEdicaoAtividadesMapro();
    const primeiroCampo = document.querySelector(
      '#corpo-atividades-mapro input:not(:disabled), ' +
      '#corpo-atividades-mapro select:not(:disabled), ' +
      '#corpo-atividades-mapro textarea:not(:disabled)'
    );
    if (primeiroCampo) primeiroCampo.focus();
    mostrarAvisoMapros('Modo de edição habilitado. Clique em SALVAR EDIÇÕES ao concluir.');
  }

  function podeEditarAtividadeClienteMapro(atividade) {
    const permissao = estadoMapros.detalhe.permissao || {};
    if (permissao.podeEditarTudo) return true;
    return Boolean(permissao.podeEditarProprias) && atividade.tipo !== 'TOPICO' &&
      String(atividade.idResponsavel || '') === String(estadoMapros.pagina.usuario.id || '');
  }

  function preencherLideresMapro(mapro) {
    const select = document.getElementById('mapro-lider');
    select.replaceChildren(criarOpcaoMapros('', 'Selecione'));
    estadoMapros.detalhe.usuarios.forEach(function (usuario) {
      const opcao = criarOpcaoMapros(usuario.id, usuario.nome);
      opcao.dataset.email = usuario.email;
      opcao.dataset.departamento = usuario.departamento || '';
      select.appendChild(opcao);
    });
    const selecionado = estadoMapros.detalhe.usuarios.find(function (usuario) {
      return usuario.id === mapro.idLider || usuario.email === mapro.emailLider;
    });
    select.value = selecionado ? selecionado.id : '';
    if (!selecionado && mapro.lider) {
      const opcaoAtual = criarOpcaoMapros(mapro.idLider || '', mapro.lider);
      opcaoAtual.dataset.email = mapro.emailLider || '';
      opcaoAtual.dataset.departamento = mapro.departamento || '';
      select.appendChild(opcaoAtual);
      select.value = opcaoAtual.value;
    }
  }

  function atualizarEmailLiderMapro() {
    const select = document.getElementById('mapro-lider');
    const opcao = select.options[select.selectedIndex];
    document.getElementById('mapro-email-lider').value = opcao ? opcao.dataset.email || '' : '';
    const departamento = opcao ? opcao.dataset.departamento || '' : '';
    preencherSelectMapros(

  function aplicarCorTitulosMatriz(cor) {
    const cartao = document.getElementById('cartao-cabecalho-mapro');

    const corValida = /^#[0-9a-f]{6}$/i.test(String(cor || '')) ? cor : '#d8d8d8';
    const vermelho = parseInt(corValida.slice(1, 3), 16);
    const verde = parseInt(corValida.slice(3, 5), 16);
    const azul = parseInt(corValida.slice(5, 7), 16);
    const luminancia = (vermelho * 299 + verde * 587 + azul * 114) / 1000;
    cartao.style.setProperty('--cor-titulos-matriz', corValida);
    cartao.style.setProperty('--cor-texto-titulos-matriz', luminancia < 145 ? '#ffffff' : '#06063d');
    cartao.style.setProperty('--cor-fundo-informacao', luminancia < 145 ? '#ffffff' : '#06063d');
    cartao.style.setProperty('--cor-texto-informacao', luminancia < 145 ? '#06063d' : '#ffffff');
    cartao.style.setProperty('--cor-remover-foto', luminancia < 145 ? '#ffffff' : '#d3092f');
    corpoProjeto.style.setProperty('--cor-titulos-matriz', corValida);
    corpoProjeto.style.setProperty('--cor-texto-titulos-matriz', luminancia < 145 ? '#ffffff' : '#06063d');
    corpoProjeto.style.setProperty('--cor-fundo-informacao', luminancia < 145 ? '#ffffff' : '#06063d');
    corpoProjeto.style.setProperty('--cor-texto-informacao', luminancia < 145 ? '#06063d' : '#ffffff');
  }

  function dataIsoCompletaValidaMapros(valor) {
    const correspondencia = String(valor || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!correspondencia) return false;
    const ano = Number(correspondencia[1]);
    const mes = Number(correspondencia[2]);
    const dia = Number(correspondencia[3]);
    const data = new Date(Date.UTC(ano, mes - 1, dia));
    return data.getUTCFullYear() === ano && data.getUTCMonth() === mes - 1 &&
      data.getUTCDate() === dia;
  }

  function normalizarDataColadaMapros(valor) {
    const texto = String(valor || '').trim().split(/\r?\n|\t/)[0].trim();
    let correspondencia = texto.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:T.*)?$/);
    let ano;
    let mes;
    let dia;
    if (correspondencia) {
      ano = correspondencia[1];
      mes = correspondencia[2];
      dia = correspondencia[3];
    } else {
      correspondencia = texto.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
      if (correspondencia) {
        dia = correspondencia[1];
        mes = correspondencia[2];
        ano = correspondencia[3];
      } else {
        correspondencia = texto.match(/^(\d{2})(\d{2})(\d{4})$/);
        if (!correspondencia) return '';
        dia = correspondencia[1];
        mes = correspondencia[2];
        ano = correspondencia[3];
      }
    }
    const dataIso = String(ano).padStart(4, '0') + '-' + String(mes).padStart(2, '0') + '-' +
      String(dia).padStart(2, '0');
    return dataIsoCompletaValidaMapros(dataIso) ? dataIso : '';
  }

  function configurarCopiaEColagemDataMapros(campo) {
    campo.addEventListener('copy', function (evento) {
      if (!evento.clipboardData || !dataIsoCompletaValidaMapros(campo.value)) return;
      const partes = campo.value.split('-');
      evento.clipboardData.setData('text/plain', partes[2] + '/' + partes[1] + '/' + partes[0]);
      evento.preventDefault();
    });
    campo.addEventListener('paste', function (evento) {
      if (!evento.clipboardData) return;
      const dataIso = normalizarDataColadaMapros(evento.clipboardData.getData('text/plain'));
      evento.preventDefault();
      if (!dataIso) {
        mostrarAvisoMapros('Cole uma data válida no formato dd/mm/aaaa ou aaaa-mm-dd.', true);
        return;
      }
      campo.value = dataIso;
      campo.dispatchEvent(new Event('input', { bubbles: true }));
      campo.dispatchEvent(new Event('change', { bubbles: true }));
    });
  }

  function formatarSemanaMapros(valor) {
    if (!dataIsoCompletaValidaMapros(valor)) return '—';
    const partes = String(valor).split('-').map(Number);
    if (partes.length !== 3 || partes.some(function (item) { return !Number.isFinite(item); })) return '—';
    const data = new Date(Date.UTC(partes[0], partes[1] - 1, partes[2]));
    const diaOriginal = data.getUTCDay();
    if (diaOriginal === 6) data.setUTCDate(data.getUTCDate() + 2);
    if (diaOriginal === 0) data.setUTCDate(data.getUTCDate() + 1);
    const dia = data.getUTCDay() || 7;
    data.setUTCDate(data.getUTCDate() + 4 - dia);
    const primeiroDia = new Date(Date.UTC(data.getUTCFullYear(), 0, 1));
    const semana = Math.ceil((((data - primeiroDia) / 86400000) + 1) / 7);
    return 'S' + semana + '/' + String(data.getUTCFullYear()).slice(-2);
  }

  function exibirFotoLiderMapro(imagem) {

    if (imagem) foto.src = imagem;
    else foto.removeAttribute('src');
  }

  function salvarFotoLiderMapro(arquivo) {
    if (!arquivo) return;
    if (!/^image\/(png|jpeg|webp)$/i.test(arquivo.type)) {
      mostrarAvisoMapros('Selecione uma imagem PNG, JPG ou WEBP.', true);
      return;
    }
    if (arquivo.size > 6 * 1024 * 1024) {
      mostrarAvisoMapros('A imagem deve possuir no máximo 6 MB.', true);
      return;
    }
    const acionador = document.getElementById('acionador-foto-lider');
    const finalizarUpload = function () {
      MaproUI.hideLoading();
      acionador.disabled = !(estadoMapros.detalhe.permissao || {}).podeEditarTudo;
      document.getElementById('arquivo-foto-lider').value = '';
    };
    acionador.disabled = true;
    MaproUI.showLoading('Adicionando imagem do líder...');
    const leitor = new FileReader();
    leitor.onerror = function () {
      mostrarAvisoMapros('Não foi possível abrir a imagem.', true);
      finalizarUpload();
    };
    leitor.onload = function () {
      const imagem = new Image();
      imagem.onerror = function () {
        mostrarAvisoMapros('O arquivo de imagem é inválido.', true);
        finalizarUpload();
      };
      imagem.onload = function () {
        const limite = 520;
        const escala = Math.min(1, limite / Math.max(imagem.width, imagem.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(imagem.width * escala));
        canvas.height = Math.max(1, Math.round(imagem.height * escala));
        canvas.getContext('2d').drawImage(imagem, 0, 0, canvas.width, canvas.height);
        const conteudo = canvas.toDataURL('image/jpeg', .82);
        const base64 = conteudo.split(',')[1] || '';
        chamarServidorMapros('salvarFotoLiderMapro', {
          idMapro: document.getElementById('mapro-id').value,
          tipo: 'image/jpeg',
          conteudoBase64: base64
        }).then(function (resposta) {
          if (!resposta.sucesso) throw new Error(resposta.mensagem || 'Não foi possível salvar a imagem.');
          exibirFotoLiderMapro(resposta.dados.imagem);
          estadoMapros.detalhe.mapro.fotoLider = resposta.dados.imagem;
          mostrarAvisoMapros(resposta.mensagem);
        }).catch(function (erro) {
          mostrarAvisoMapros(erro.message, true);
        }).finally(finalizarUpload);
      };
      imagem.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  }

  async function removerFotoLiderMapro() {
    const botao = document.getElementById('remover-foto-lider');

  }

  function agendarAutosaveMapro(atraso) {
    clearTimeout(temporizadorAutosaveMapro);
    autosaveMaproPendente = true;
    atualizarEstadoAutosaveMapro('Alterações pendentes...', 'salvando');
    temporizadorAutosaveMapro = setTimeout(executarAutosaveMapro, atraso == null ? 800 : atraso);
  }

  async function executarAutosaveMapro() {
    clearTimeout(temporizadorAutosaveMapro);
    if (autosaveMaproEmAndamento || atividadeMaproEmSalvamento) {
      autosaveMaproPendente = true;
      return;
    }
    const formulario = document.getElementById('formulario-cabecalho-mapro');
    if (!estadoMapros.detalhe || !formulario.checkValidity()) {
      atualizarEstadoAutosaveMapro('Preencha os campos obrigatórios para salvar.', 'falha');
      return;
    }
    autosaveMaproEmAndamento = true;
    autosaveMaproPendente = false;
    atualizarEstadoAutosaveMapro('Salvando alterações...', 'salvando');
    const dados = obterDadosCabecalhoMapro();
    const assinaturaEnviada = assinaturaCabecalhoMapro(dados);
    if (assinaturaEnviada === assinaturaCabecalhoMaproSalva) {
      autosaveMaproEmAndamento = false;
      atualizarEstadoAutosaveMapro('Cabeçalho salvo automaticamente', '');
      return;
    }
    let atrasoRepeticao = 100;
    try {
      const resposta = await chamarServidorMapros('salvarCabecalhoMapro', dados);
      if (!resposta.sucesso) throw new Error(resposta.mensagem);
      const resultado = resposta.dados || {};
      if (resultado.version) {
        document.getElementById('mapro-version').value = resultado.version;
        estadoMapros.detalhe.mapro.version = resultado.version;
      }
      if (typeof resultado.departamento === 'string') {
        preencherSelectMapros(
          'mapro-departamento',
          estadoMapros.detalhe.bases.departamentos,
          resultado.departamento
        );
        document.getElementById('mapro-departamento').disabled = true;
        estadoMapros.detalhe.mapro.departamento = resultado.departamento;
      }
      assinaturaCabecalhoMaproSalva = assinaturaEnviada;
      if (assinaturaCabecalhoMapro(obterDadosCabecalhoMapro()) !== assinaturaEnviada) {
        autosaveMaproPendente = true;
      }
      atualizarEstadoAutosaveMapro('Cabeçalho salvo automaticamente', '');
    } catch (erro) {
      atualizarEstadoAutosaveMapro('Não foi possível salvar automaticamente.', 'falha');
      mostrarAvisoMapros(erro.message, true);
      if (erro.message === 'Falha de comunicação com o servidor.') {
        autosaveMaproPendente = true;
        atrasoRepeticao = 2500;
      }
    } finally {
      autosaveMaproEmAndamento = false;
      if (autosaveMaproPendente) agendarAutosaveMapro(atrasoRepeticao);
    }
  }

  function renderizarAtividadesMapro() {
    const atividades = estadoMapros.detalhe.atividades.concat(estadoMapros.rascunhosAtividades);
    const corpo = document.getElementById('corpo-atividades-mapro');
    const estado = document.getElementById('estado-atividades-mapro');
    const tabela = document.getElementById('tabela-atividades-container');
    corpo.replaceChildren();
    atualizarEstadoModoEdicaoAtividadesMapro();
    atualizarAgregadosTopicosClienteMapro(atividades);
    atualizarResumoExecutivoMapro(atividades);
    if (!atividades.length) {
      estado.hidden = false;
      tabela.hidden = true;
      agendarCabecalhoFixoAtividadesMapro();
      return;
    }
    const ordenadas = atividades.slice().sort(function (a, b) {
      return Number(a.ordem || 0) - Number(b.ordem || 0);
    });
    const visitadas = {};
    const filhosPorPai = {};
    ordenadas.forEach(function (atividade) {
      const idPai = String(atividade.idAtividadePai || '');
      if (!filhosPorPai[idPai]) filhosPorPai[idPai] = [];
      filhosPorPai[idPai].push(atividade);
    });
    const marcarRamoComoVisitado = function (idPai) {
      (filhosPorPai[String(idPai)] || []).forEach(function (filha) {
        visitadas[filha.idAtividade] = true;
        marcarRamoComoVisitado(filha.idAtividade);
      });
    };
    const adicionarRamo = function (atividade, nivel, numero) {
      if (visitadas[atividade.idAtividade]) return;
      visitadas[atividade.idAtividade] = true;
      corpo.appendChild(criarLinhaAtividadeMapro(atividade, nivel, numero));
      if (estadoMapros.nosRecolhidos[atividade.idAtividade]) {
        marcarRamoComoVisitado(atividade.idAtividade);
        return;
      }
      (filhosPorPai[String(atividade.idAtividade)] || []).forEach(function (filha, indice) {
        adicionarRamo(filha, nivel + 1, numero + '.' + (indice + 1));
      });
    };
    ordenadas.filter(function (item) { return item.tipo === 'TOPICO'; })
      .forEach(function (topico, indice) { adicionarRamo(topico, 0, String(indice + 1)); });
    let numeroOrfao = ordenadas.filter(function (item) { return item.tipo === 'TOPICO'; }).length;
    ordenadas.forEach(function (atividade) {
      if (!visitadas[atividade.idAtividade]) {
        numeroOrfao += 1;
        adicionarRamo(atividade, 0, String(numeroOrfao));
      }
    });
    estado.hidden = true;
    tabela.hidden = false;
    agendarCabecalhoFixoAtividadesMapro();
  }

  function agendarCabecalhoFixoAtividadesMapro() {
    if (quadroCabecalhoFixoAtividadesMapro) return;
    quadroCabecalhoFixoAtividadesMapro = window.requestAnimationFrame(function () {
      quadroCabecalhoFixoAtividadesMapro = 0;
      atualizarCabecalhoFixoAtividadesMapro();
    });
  }

  function atualizarCabecalhoFixoAtividadesMapro() {
    const fixo = document.getElementById('cabecalho-fixo-atividades-mapro');
    const etapa = document.getElementById('etapa-detalhe-mapro');
    const container = document.getElementById('tabela-atividades-container');
    const tabela = container && container.querySelector('.tabela-atividades-mapro');
    const cabecalho = tabela && tabela.tHead;
    const tituloCorpo = document.querySelector('.titulo-corpo-projeto');
    if (!fixo || etapa.hidden || !container || container.hidden || !cabecalho) {
      if (fixo) fixo.hidden = true;
      return;
    }

    const barraDetalhe = document.querySelector('.barra-detalhe-mapro');
    const limiteSuperior = barraDetalhe
      ? Math.max(0, Math.ceil(barraDetalhe.getBoundingClientRect().bottom)) : 0;
    if (tituloCorpo) tituloCorpo.style.top = limiteSuperior + 'px';
    const retanguloContainer = container.getBoundingClientRect();
    const retanguloCabecalho = cabecalho.getBoundingClientRect();
    const retanguloTitulo = tituloCorpo && tituloCorpo.getBoundingClientRect();
    const limiteCabecalho = retanguloTitulo
      ? Math.max(limiteSuperior, Math.ceil(retanguloTitulo.bottom)) : limiteSuperior;
    const esquerdaVisivel = Math.max(0, retanguloContainer.left);
    const direitaVisivel = Math.min(window.innerWidth, retanguloContainer.right);
    const deveFixar = window.innerWidth > 760 && retanguloCabecalho.top < limiteCabecalho &&
      retanguloContainer.bottom > limiteCabecalho + retanguloCabecalho.height &&
      direitaVisivel > esquerdaVisivel;
    if (!deveFixar) {
      fixo.hidden = true;
      return;
    }

    const tabelaFixa = document.getElementById('tabela-cabecalho-fixo-atividades-mapro');
    if (!tabelaFixa.tHead) tabelaFixa.appendChild(cabecalho.cloneNode(true));
    const celulasOriginais = cabecalho.querySelectorAll('th');
    const celulasFixas = tabelaFixa.tHead.querySelectorAll('th');
    celulasOriginais.forEach(function (celula, indice) {
      const largura = celula.getBoundingClientRect().width + 'px';
      celulasFixas[indice].style.width = largura;
      celulasFixas[indice].style.minWidth = largura;

  function atualizarAgregadosTopicosClienteMapro(atividades) {
    const filhosPorPai = {};
    atividades.forEach(function (atividade) {
      const pai = atividade.idAtividadePai || '';
      if (!filhosPorPai[pai]) filhosPorPai[pai] = [];
      filhosPorPai[pai].push(atividade);
    });
    const processar = function (atividade) {
      const filhos = filhosPorPai[atividade.idAtividade] || [];
      filhos.forEach(processar);
      if (filhos.length) {
        const inicios = filhos.map(function (item) { return item.dataInicio; }).filter(Boolean).sort();
        const finais = filhos.map(function (item) { return item.dataFinal; }).filter(Boolean).sort();
        atividade.dataInicio = inicios.length ? inicios[0] : '';
        atividade.dataFinal = finais.length ? finais[finais.length - 1] : '';
        atividade.semanaInicio = formatarSemanaMapros(atividade.dataInicio);
        atividade.semanaFinal = formatarSemanaMapros(atividade.dataFinal);
        if (atividade.tipo === 'TOPICO') {
          const descendentes = [];
          const coletar = function (idPai) {
            (filhosPorPai[idPai] || []).forEach(function (filha) {
              descendentes.push(filha);
              coletar(filha.idAtividade);
            });
          };
          coletar(atividade.idAtividade);
          const aplicaveis = descendentes.filter(function (item) {
            return item.tipo !== 'TOPICO' && item.status !== 'NAO_APLICAVEL';
          });
          atividade.status = !aplicaveis.length ? 'NAO_APLICAVEL' :
            aplicaveis.every(function (item) { return item.status === 'CONCLUIDA'; })
              ? 'CONCLUIDA' : 'EM_ANDAMENTO';
        }
      }
      atividade.saude = calcularSaudeAtividadeClienteMapro(atividade);
    };
    (filhosPorPai[''] || []).forEach(processar);
  }

  function calcularSaudeAtividadeClienteMapro(atividade) {
    const status = String(atividade.status || '').toUpperCase();
    if (status === 'CONCLUIDA') return 'AZUL';
    if (status === 'NAO_APLICAVEL') return 'CINZA';
    const prazoFinal = String(atividade.dataFinal || '');
    if (!prazoFinal) return 'VERDE';
    const hoje = new Date();
    const hojeIso = hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0') + '-' +
      String(hoje.getDate()).padStart(2, '0');
    if (prazoFinal < hojeIso) return 'VERMELHO';
    const limite = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + 3);
    const limiteIso = limite.getFullYear() + '-' + String(limite.getMonth() + 1).padStart(2, '0') + '-' +
      String(limite.getDate()).padStart(2, '0');
    return prazoFinal <= limiteIso ? 'AMARELO' : 'VERDE';
  }

  function atualizarResumoExecutivoMapro(atividades) {
    const operacionais = atividades.filter(function (item) {
      return item.tipo !== 'TOPICO' && !item.rascunho;
    });
    const folhas = operacionais.filter(function (item) {
      return !atividades.some(function (possivelFilha) {
        return possivelFilha.idAtividadePai === item.idAtividade && !possivelFilha.rascunho;
      }) && item.status !== 'NAO_APLICAVEL';
    });
    const concluidasFolhas = folhas.filter(function (item) { return item.status === 'CONCLUIDA'; }).length;
    const percentual = folhas.length ? Math.round((concluidasFolhas / folhas.length) * 100) : 0;
    const preenchimentoProgresso = document.getElementById('progresso-detalhe-mapro');
    preenchimentoProgresso.style.width = percentual + '%';
    preenchimentoProgresso.parentElement.style.setProperty('--progresso-mapro', percentual + '%');
    document.getElementById('percentual-detalhe-mapro').textContent = percentual + '%';
    const hoje = new Date();
    const hojeIso = hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0') + '-' +
      String(hoje.getDate()).padStart(2, '0');
    document.getElementById('semana-atual-mapro').textContent = formatarSemanaMapros(hojeIso).replace(/^S/, '');
    document.getElementById('total-atividades-mapro').textContent = atividades.length;
    document.getElementById('atividades-concluidas-mapro').textContent = operacionais.filter(function (item) {
      return item.status === 'CONCLUIDA';
    }).length;
    document.getElementById('atividades-atrasadas-mapro').textContent = operacionais.filter(function (item) {
      return item.saude === 'VERMELHO';
    }).length;
    document.getElementById('atividades-nao-aplicaveis-mapro').textContent = operacionais.filter(function (item) {
      return item.status === 'NAO_APLICAVEL';
    }).length;
  }

  function obterNumeracaoAtividadesMapro() {
    const atividades = estadoMapros.detalhe.atividades.slice().sort(function (a, b) {
      return Number(a.ordem || 0) - Number(b.ordem || 0);
    });
    const filhosPorPai = {};
    const numeros = {};
    atividades.forEach(function (atividade) {
      const pai = String(atividade.idAtividadePai || '');
      if (!filhosPorPai[pai]) filhosPorPai[pai] = [];
      filhosPorPai[pai].push(atividade);
    });
    const numerar = function (atividade, numero) {
      numeros[atividade.idAtividade] = numero;
      (filhosPorPai[String(atividade.idAtividade)] || []).forEach(function (filha, indice) {
        numerar(filha, numero + '.' + (indice + 1));
      });
    };
    (filhosPorPai[''] || []).forEach(function (atividade, indice) {
      numerar(atividade, String(indice + 1));
    });
    return numeros;
  }

  function criarOpcoesPredecessorasMapro(atividade) {
    const atividades = estadoMapros.detalhe.atividades;
    const numeros = obterNumeracaoAtividadesMapro();
    const possuiFilhos = function (id) {
      return atividades.some(function (item) {
        return String(item.idAtividadePai || '') === String(id);
      });
    };
    const criariaCiclo = function (candidata) {
      const porId = {};
      atividades.forEach(function (item) { porId[String(item.idAtividade)] = item; });
      const visitadas = {};
      let atual = candidata;
      while (atual) {
        const id = String(atual.idAtividade || '');
        if (id === String(atividade.idAtividade)) return true;
        if (!id || visitadas[id]) return false;
        visitadas[id] = true;
        atual = porId[String(atual.idAtividadePredecessora || '')];
      }
      return false;
    };
    return atividades.filter(function (candidata) {
      return candidata.tipo !== 'TOPICO' && candidata.idAtividade !== atividade.idAtividade &&
        !candidata.rascunho && !possuiFilhos(candidata.idAtividade) && !criariaCiclo(candidata);
    }).map(function (candidata) {
      const prefixo = numeros[candidata.idAtividade]
        ? numeros[candidata.idAtividade] + ' — ' : '';
      return {
        valor: candidata.idAtividade,
        texto: prefixo + String(candidata.nomeAtividade || 'Atividade sem descrição')
      };
    });
  }

  function formatarDiasReplanejadosMapro(valor) {
    const dias = Number(valor || 0);
    if (!dias) return '0 dias';
    return (dias > 0 ? '+' : '') + dias + (Math.abs(dias) === 1 ? ' dia' : ' dias');
  }

      atividade.rascunho || !podeEditarTudo ||
      estadoMapros.movimentosPendentes[atividade.idAtividade]
    );
    let destinoArraste = null;
    let pontoInicialArraste = null;
    let fantasmaArraste = null;
    const limparArraste = function () {
      linha.classList.remove('arrastando');
      document.querySelectorAll('.destino-arraste-mapro').forEach(function (item) {
        item.classList.remove('destino-arraste-mapro');
      });
      if (fantasmaArraste) fantasmaArraste.remove();
      fantasmaArraste = null;
      pontoInicialArraste = null;
      estadoMapros.atividadeArrastada = null;
    };
    const criarFantasmaArraste = function (evento) {
      const caixa = linha.getBoundingClientRect();
      fantasmaArraste = linha.cloneNode(true);
      fantasmaArraste.querySelectorAll('[id]').forEach(function (elemento) {
        elemento.removeAttribute('id');
      });
      fantasmaArraste.classList.add('fantasma-arraste-mapro');
      fantasmaArraste.style.left = caixa.left + 'px';
      fantasmaArraste.style.top = (evento.clientY - pontoInicialArraste.deslocamentoY) + 'px';
      fantasmaArraste.style.width = caixa.width + 'px';
      document.body.appendChild(fantasmaArraste);
      linha.classList.add('arrastando');
      estadoMapros.atividadeArrastada = atividade;
    };
    mover.addEventListener('pointerdown', function (evento) {
      if (mover.disabled || evento.button > 0) return;
      evento.preventDefault();
      const caixa = linha.getBoundingClientRect();
      pontoInicialArraste = {
        x: evento.clientX,
        y: evento.clientY,
        deslocamentoY: evento.clientY - caixa.top
      };
      destinoArraste = null;
      if (mover.setPointerCapture) mover.setPointerCapture(evento.pointerId);
    });
    mover.addEventListener('pointermove', function (evento) {
      if (!pontoInicialArraste || mover.disabled) return;
      if (evento.pointerType === 'mouse' && !(evento.buttons & 1)) {
        limparArraste();
        return;
      }
      const distancia = Math.hypot(
        evento.clientX - pontoInicialArraste.x,
        evento.clientY - pontoInicialArraste.y
      );
      if (!fantasmaArraste && distancia < 4) return;
      if (!fantasmaArraste) criarFantasmaArraste(evento);
      fantasmaArraste.style.top = (evento.clientY - pontoInicialArraste.deslocamentoY) + 'px';
      const containerTabela = document.getElementById('tabela-atividades-container');

      document.querySelectorAll('.destino-arraste-mapro').forEach(function (item) {
        item.classList.remove('destino-arraste-mapro');

      const alvo = document.elementFromPoint(evento.clientX, evento.clientY);
