<script>
  const estadoDashboard = {
    dados: null,
    projetos: [],
    filtrados: [],
    portfolios: [],
    aba: 'mapros',
    menuIndicadoresAtividadesRecolhido: false,
    indicadorDetalhe: '',
    indicadorAtividades: '',
    filtroFaixaConclusao: '',
    filtroGraficoPortfolio: '',
    buscaTabelaMapros: '',
    buscaTabelaAtividades: '',
    paginaMapros: 1,
    paginaAtividades: 1,
    tamanhoPaginaMapros: 20,
    tamanhoPaginaAtividades: 20,
    ordenacaoMapros: {campo: 'id', direcao: 'asc'},
    ordenacaoAtividades: {campo: 'prazo', direcao: 'asc'},
    atualizadoEm: '',
    carregando: false,
    segmentosRosca: []
  };
  function chamarServidorDashboard(nome, ...argumentos) {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(function () {
        reject(new Error('Falha de comunicação com o servidor.'));
      })[nome](...argumentos);
    });
  }

  async function iniciarDashboard() {
    if (estadoDashboard.carregando) return;
    estadoDashboard.carregando = true;
    const botaoAtualizar = document.getElementById('atualizar-dashboard');
    botaoAtualizar.disabled = true;
    botaoAtualizar.setAttribute('aria-busy', 'true');
    MaproUI.showLoading('Carregando indicadores...');
    try {
      const resposta = await chamarServidorDashboard('carregarDashboardMapro');
      if (!resposta.sucesso) throw new Error(resposta.mensagem);
      estadoDashboard.dados = resposta.dados;
      estadoDashboard.projetos = resposta.dados.projetos || [];
      const portfoliosDisponiveis = valoresUnicosDashboard('portfolio');
      estadoDashboard.portfolios = estadoDashboard.portfolios.filter(function (portfolio) {
        return portfoliosDisponiveis.includes(portfolio);
      });
      if (!portfoliosDisponiveis.includes(estadoDashboard.filtroGraficoPortfolio)) {
        estadoDashboard.filtroGraficoPortfolio = '';
      }
      estadoDashboard.atualizadoEm = resposta.dados.atualizadoEm || new Date().toISOString();
      document.getElementById('logo-dashboard').src = resposta.dados.logoUrl;
      document.getElementById('logo-empresa-dashboard').src = resposta.dados.logoEmpresaUrl;
      document.getElementById('escopo-dashboard').textContent = resposta.dados.admin
        ? 'Visão corporativa · todos os projetos'
        : 'Minha visão · somente projetos relacionados';
      preencherFiltrosDashboard();
      montarMenuPortfoliosDashboard();
      atualizarRotuloPortfoliosDashboard();
      document.getElementById('estado-dashboard').hidden = true;
      document.getElementById('layout-dashboard').hidden = false;
      atualizarMomentoDashboard();
      aplicarFiltrosDashboard();
    } catch (erro) {
      const estado = document.getElementById('estado-dashboard');
      estado.textContent = erro.message;
      estado.classList.add('falha');
    } finally {
      estadoDashboard.carregando = false;
      botaoAtualizar.disabled = false;
      botaoAtualizar.setAttribute('aria-busy', 'false');
      MaproUI.hideLoading();
    }
  }

  function atualizarMomentoDashboard() {
    const data = new Date(estadoDashboard.atualizadoEm || Date.now());
    const rotulo = Number.isNaN(data.getTime()) ? '' : new Intl.DateTimeFormat('pt-BR', {
      timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', hour12: false
    }).format(data);
    document.getElementById('atualizado-em-dashboard').textContent =
      rotulo ? 'Atualizado às ' + rotulo : 'Dados atualizados';
  }

  function valoresUnicosDashboard(campo) {
    return Array.from(new Set(estadoDashboard.projetos.map(function (item) {
      return String(item[campo] || '').trim();
    }).filter(Boolean))).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
  }

  function preencherSelectDashboard(id, valores) {
    const select = document.getElementById(id);
    const valorAtual = select.value;
    while (select.options.length > 1) select.remove(1);
    valores.forEach(function (valor) {
      const opcao = document.createElement('option');
      opcao.value = valor;
      opcao.textContent = valor;
      select.appendChild(opcao);
    });
    if (valores.includes(valorAtual)) select.value = valorAtual;
  }

  function preencherFiltrosDashboard() {
    preencherSelectDashboard('filtro-contagiro', valoresUnicosDashboard('contagiro'));
    preencherSelectDashboard('filtro-status', valoresUnicosDashboard('status'));
    preencherSelectDashboard('filtro-area', valoresUnicosDashboard('area'));
    preencherSelectDashboard('filtro-nivel', valoresUnicosDashboard('nivel'));
    montarOpcoesLiderDashboard();
  }

  function montarOpcoesLiderDashboard() {
    const campo = document.getElementById('filtro-lider');
    const lista = document.getElementById('opcoes-lider-dashboard');
    const busca = normalizarBuscaDashboard(campo.value);
    lista.replaceChildren();
    const todos = document.createElement('button');
    todos.type = 'button';
    todos.className = 'opcao-lider-dashboard';
    todos.setAttribute('role', 'option');
    todos.setAttribute('aria-selected', String(!campo.value));
    todos.textContent = 'Todos os líderes';
    todos.addEventListener('click', function () {
      campo.value = '';
      fecharOpcoesLiderDashboard();
      aplicarFiltrosDashboard();
    });
    lista.appendChild(todos);
    valoresUnicosDashboard('lider').filter(function (lider) {
      return !busca || normalizarBuscaDashboard(lider).includes(busca);
    }).forEach(function (lider) {
      const opcao = document.createElement('button');
      opcao.type = 'button';
      opcao.className = 'opcao-lider-dashboard';
      opcao.setAttribute('role', 'option');
      opcao.setAttribute('aria-selected', String(campo.value === lider));
      opcao.textContent = lider;
      opcao.addEventListener('click', function () {
        campo.value = lider;
        fecharOpcoesLiderDashboard();
        aplicarFiltrosDashboard();
      });
      lista.appendChild(opcao);
    });
  }

  function abrirOpcoesLiderDashboard() {
    montarOpcoesLiderDashboard();
    document.getElementById('opcoes-lider-dashboard').hidden = false;
    document.getElementById('filtro-lider').setAttribute('aria-expanded', 'true');
  }

  function fecharOpcoesLiderDashboard() {
    document.getElementById('opcoes-lider-dashboard').hidden = true;
    document.getElementById('filtro-lider').setAttribute('aria-expanded', 'false');
  }

  function atualizarRotuloPortfoliosDashboard() {
    document.getElementById('abrir-portfolios-dashboard').textContent =
      estadoDashboard.portfolios.length
        ? estadoDashboard.portfolios.length + ' portfólio(s) selecionado(s) ▾'
        : 'Todos os portfólios ▾';
  }

  function montarMenuPortfoliosDashboard() {
    const menu = document.getElementById('opcoes-portfolios-dashboard');
    menu.replaceChildren();
    const busca = normalizarBuscaDashboard(
      document.getElementById('pesquisar-portfolio-dashboard').value
    );
    valoresUnicosDashboard('portfolio')
      .filter(function (portfolio) {
        return normalizarBuscaDashboard(portfolio).includes(busca);
      })
      .forEach(function (portfolio) {
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = estadoDashboard.portfolios.includes(portfolio);
        input.addEventListener('change', function () {
          estadoDashboard.portfolios = input.checked
            ? estadoDashboard.portfolios.concat(portfolio)
            : estadoDashboard.portfolios.filter(function (item) { return item !== portfolio; });
          atualizarRotuloPortfoliosDashboard();
          aplicarFiltrosDashboard();
        });
        const texto = document.createElement('span');
        texto.textContent = portfolio;
        label.append(input, texto);
        menu.appendChild(label);
      });
  }

  function normalizarBuscaDashboard(valor) {
    return String(valor || '').normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }

  function aplicarFiltrosDashboard() {
    const visaoGeral = estadoDashboard.aba === 'mapros';
    const contagiro = visaoGeral ? document.getElementById('filtro-contagiro').value : '';
    const inicioDe = visaoGeral ? document.getElementById('filtro-inicio-de').value : '';
    const inicioAte = visaoGeral ? document.getElementById('filtro-inicio-ate').value : '';
    const prazoDe = visaoGeral ? document.getElementById('filtro-prazo-de').value : '';
    const prazoAte = visaoGeral ? document.getElementById('filtro-prazo-ate').value : '';
    const status = visaoGeral ? document.getElementById('filtro-status').value : '';
    const area = visaoGeral ? document.getElementById('filtro-area').value : '';
    const nivel = visaoGeral ? document.getElementById('filtro-nivel').value : '';
    const lider = visaoGeral
      ? normalizarBuscaDashboard(document.getElementById('filtro-lider').value) : '';
    const busca = visaoGeral
      ? normalizarBuscaDashboard(document.getElementById('filtro-mapro').value) : '';
    estadoDashboard.filtrados = estadoDashboard.projetos.filter(function (projeto) {
      return (!contagiro || projeto.contagiro === contagiro) &&
        (!inicioDe || projeto.dataInicio >= inicioDe) &&
        (!inicioAte || projeto.dataInicio <= inicioAte) &&
        (!prazoDe || projeto.prazo >= prazoDe) &&
        (!prazoAte || projeto.prazo <= prazoAte) &&
        (!status || projeto.status === status) &&
        (!area || projeto.area === area) &&
        (!nivel || projeto.nivel === nivel) &&
        (!lider || normalizarBuscaDashboard(projeto.lider).includes(lider)) &&
        (!estadoDashboard.portfolios.length ||
          estadoDashboard.portfolios.includes(projeto.portfolio)) &&
        (!busca || normalizarBuscaDashboard(projeto.id + ' ' + projeto.nome).includes(busca));
    });
    estadoDashboard.paginaMapros = 1;
    estadoDashboard.paginaAtividades = 1;
    renderizarDashboard();
  }

  function alternarAbaDashboard(aba) {
    estadoDashboard.aba = aba === 'atividades' ? 'atividades' : 'mapros';
    document.querySelectorAll('[data-aba-dashboard]').forEach(function (botao) {
      const ativa = botao.dataset.abaDashboard === estadoDashboard.aba;
      botao.classList.toggle('ativa', ativa);
      botao.setAttribute('aria-selected', String(ativa));
      botao.tabIndex = ativa ? 0 : -1;
    });
    document.getElementById('aba-mapros-dashboard').hidden = estadoDashboard.aba !== 'mapros';
    document.getElementById('aba-atividades-dashboard').hidden =
      estadoDashboard.aba !== 'atividades';
    const botaoFiltros = document.getElementById('abrir-filtros-dashboard');
    const seletorPortfolio = document.querySelector('.seletor-portfolio-dashboard');
    const emAtividades = estadoDashboard.aba === 'atividades';
    document.querySelector('.barra-abas-dashboard').classList.toggle('modo-atividades', emAtividades);
    botaoFiltros.hidden = emAtividades;
    seletorPortfolio.hidden = false;
    if (estadoDashboard.aba === 'atividades') {
      document.getElementById('painel-filtros-dashboard').hidden = true;
      botaoFiltros.setAttribute('aria-expanded', 'false');
    }
  }

  function renderizarDashboard() {
    alternarAbaDashboard(estadoDashboard.aba);
    renderizarIndicadoresDashboard();
    renderizarDetalhesIndicadorDashboard();
    renderizarRoscaDashboard();
    renderizarBarrasDashboard(
      'grafico-portfolios',
      contarPorDashboard('portfolio'),
      ['#287fc2', '#16c7d8', '#8b5cf6', '#42d779', '#ff9f43']
    );
    renderizarIndicadoresAtividadesDashboard();
    renderizarMinhasAtividadesDashboard();
    atualizarResumoFiltrosDashboard();
  }

  function diasEntreDashboard(inicio, fim) {
    if (!inicio || !fim) return null;
    const a = new Date(inicio + 'T00:00:00Z');
    const b = new Date(fim + 'T00:00:00Z');
    return Math.max(0, Math.round((b - a) / 86400000));
  }

  function filtrarProjetosPorIndicadorDashboard(projetos, chave) {
    if (chave === 'emAndamento') {
      return projetos.filter(function (projeto) { return projeto.status === 'EM ANDAMENTO'; });
    }
    if (chave === 'concluidas' || chave === 'tempoMedio') {
      return projetos.filter(function (projeto) { return projeto.status === 'CONCLUÍDA'; });
    }
    if (chave === 'naoAplicaveis') {
      return projetos.filter(function (projeto) { return projeto.status === 'NÃO APLICÁVEL'; });
    }
    if (chave === 'naoIniciadas') {
      return projetos.filter(function (projeto) {
        return projeto.status === 'AGUARDANDO INÍCIO';
      });
    }
    if (chave === 'canceladas') {
      return projetos.filter(function (projeto) { return projeto.status === 'CANCELADA'; });
    }
    if (chave === 'replanejadas') {
      return projetos.filter(function (projeto) { return projeto.replanejada === true; });
    }
    if (chave === 'novasAtividades') {
      return projetos.filter(function (projeto) { return projeto.temNovasAtividades === true; });
    }
    return projetos.slice();
  }

  function projetoNaFaixaConclusaoDashboard(projeto, faixa) {
    const percentual = Number(projeto.percentual) || 0;
    if (faixa === 'menos50') return percentual < 50;
    if (faixa === '50a70') return percentual >= 50 && percentual < 70;
    if (faixa === '70a90') return percentual >= 70 && percentual < 90;
    if (faixa === '90mais') return percentual >= 90;
    return true;
  }

  function obterProjetosCruzadosDashboard(opcoes) {
    const config = opcoes || {};
    let projetos = estadoDashboard.filtrados.slice();
    if (!config.ignorarIndicador && estadoDashboard.indicadorDetalhe) {
      projetos = filtrarProjetosPorIndicadorDashboard(
        projetos, estadoDashboard.indicadorDetalhe
      );
    }
    if (!config.ignorarFaixa && estadoDashboard.filtroFaixaConclusao) {
      projetos = projetos.filter(function (projeto) {
        return projetoNaFaixaConclusaoDashboard(
          projeto, estadoDashboard.filtroFaixaConclusao
        );
      });
    }
    if (!config.ignorarPortfolio && estadoDashboard.filtroGraficoPortfolio) {
      projetos = projetos.filter(function (projeto) {
        return projeto.portfolio === estadoDashboard.filtroGraficoPortfolio;
      });
    }
    return projetos;
  }

  function obterProjetosIndicadorDashboard(chave) {
    return filtrarProjetosPorIndicadorDashboard(
      obterProjetosCruzadosDashboard({ignorarIndicador: true}), chave
    );
  }

  function porcentagemIndicadorDashboard(valor, total) {
    return total ? Math.round(valor / total * 100) + '%' : '0%';
  }

  function criarCardProjetoDashboard(item, classe) {
    const card = document.createElement('button');
    const ativo = item.chave === 'todas'
      ? !estadoDashboard.indicadorDetalhe
      : estadoDashboard.indicadorDetalhe === item.chave;
    card.type = 'button';
    card.className = 'indicador-dashboard indicador-dashboard-clicavel ' +
      (classe || '') + (ativo ? ' ativo' : '');
    card.style.setProperty('--cor-indicador', item.cor);
    card.setAttribute('aria-pressed', String(ativo));
    card.setAttribute('aria-controls', 'detalhes-indicador-dashboard');
    card.title = ativo ? 'Clique para retirar o filtro' : 'Clique para filtrar tabela e gráficos';
    card.addEventListener('click', function () {
      estadoDashboard.indicadorDetalhe = item.chave === 'todas' || ativo ? '' : item.chave;
      estadoDashboard.paginaMapros = 1;
      renderizarDashboard();
    });
    const rotulo = document.createElement('span');
    rotulo.textContent = item.rotulo;
    const metricas = document.createElement('div');
    metricas.className = 'metricas-indicador-dashboard';
    const valor = document.createElement('strong');
    valor.textContent = item.valor;
    metricas.appendChild(valor);
    if (item.percentual) {
      const percentual = document.createElement('small');
      percentual.className = 'percentual-indicador-dashboard';
      percentual.textContent = item.percentual;
      metricas.appendChild(percentual);
    }
    card.append(rotulo, metricas);
    if (item.apoio) {
      const apoio = document.createElement('small');
      apoio.className = 'apoio-indicador-dashboard';
      apoio.textContent = item.apoio;
      card.appendChild(apoio);
    }
    return card;
  }

  function renderizarIndicadoresDashboard() {
    const projetos = obterProjetosCruzadosDashboard({ignorarIndicador: true});
    const total = projetos.length;
    const emAndamento = obterProjetosIndicadorDashboard('emAndamento');
    const naoIniciadas = obterProjetosIndicadorDashboard('naoIniciadas');
    const concluidas = obterProjetosIndicadorDashboard('concluidas');
    const naoAplicaveis = obterProjetosIndicadorDashboard('naoAplicaveis');
    const replanejadas = obterProjetosIndicadorDashboard('replanejadas');
    const novas = obterProjetosIndicadorDashboard('novasAtividades');
    const canceladas = obterProjetosIndicadorDashboard('canceladas');
    const duracoes = concluidas.map(function (projeto) {
      return diasEntreDashboard(projeto.dataInicio, projeto.conclusaoEm);
    }).filter(function (valor) { return valor !== null; });
    const media = duracoes.length
      ? Math.round(duracoes.reduce(function (a, b) { return a + b; }, 0) / duracoes.length)
      : 0;
    const meses = media / 30.44;
    const mesesFormatados = meses.toLocaleString('pt-BR', {
      minimumFractionDigits: 1,
      maximumFractionDigits: 1
    }) + (Math.abs(meses - 1) < 0.05 ? ' mês' : ' meses');
    const grade = document.getElementById('indicadores-dashboard');
    grade.replaceChildren();

    grade.appendChild(criarCardProjetoDashboard({
      chave: 'todas',
      rotulo: 'QUANTIDADE DE MAPROS',
      valor: total,
      percentual: '100%',
      apoio: 'Projetos no recorte atual',
      cor: '#06063d'
    }, 'indicador-total-dashboard'));

    const grupoStatus = document.createElement('div');
    grupoStatus.className = 'grupo-status-indicadores-dashboard';
    [
      {chave: 'emAndamento', rotulo: 'EM ANDAMENTO', valor: emAndamento.length,
        percentual: porcentagemIndicadorDashboard(emAndamento.length, total), cor: '#16c7d8'},
      {chave: 'naoIniciadas', rotulo: 'NÃO INICIADAS', valor: naoIniciadas.length,
        percentual: porcentagemIndicadorDashboard(naoIniciadas.length, total), cor: '#ff9f43'},
      {chave: 'concluidas', rotulo: 'CONCLUÍDAS', valor: concluidas.length,
        percentual: porcentagemIndicadorDashboard(concluidas.length, total), cor: '#287fc2'},
      {chave: 'naoAplicaveis', rotulo: 'NÃO APLICÁVEIS', valor: naoAplicaveis.length,
        percentual: porcentagemIndicadorDashboard(naoAplicaveis.length, total), cor: '#77798b'}
    ].forEach(function (item) {
      grupoStatus.appendChild(criarCardProjetoDashboard(item, 'indicador-status-dashboard'));
    });
    grade.appendChild(grupoStatus);

    const grupoAcompanhamento = document.createElement('div');
    grupoAcompanhamento.className = 'grupo-acompanhamento-indicadores-dashboard';
    grupoAcompanhamento.append(
      criarCardProjetoDashboard({
        chave: 'replanejadas', rotulo: 'MAPROS REPLANEJADAS',
        valor: replanejadas.length,
        percentual: porcentagemIndicadorDashboard(replanejadas.length, total),
        cor: '#8b5cf6'
      }, 'indicador-compacto-dashboard'),
      criarCardProjetoDashboard({
        chave: 'novasAtividades', rotulo: 'MAPROS COM NOVAS ATIVIDADES',
        valor: novas.length,
        percentual: porcentagemIndicadorDashboard(novas.length, total),
        cor: '#0aaec0'
      }, 'indicador-compacto-dashboard')
    );
    grade.appendChild(grupoAcompanhamento);

    const grupoRodape = document.createElement('div');
    grupoRodape.className = 'grupo-rodape-indicadores-dashboard';
    grupoRodape.appendChild(criarCardProjetoDashboard({
      chave: 'tempoMedio',
      rotulo: 'TEMPO MÉDIO DE CONCLUSÃO',
      valor: media + ' dias',
      percentual: mesesFormatados,
      apoio: 'Baseado em ' + duracoes.length + ' Mapro(s) concluída(s)',
      cor: '#ec0e37'
    }, 'indicador-tempo-dashboard'));
    if (estadoDashboard.dados && estadoDashboard.dados.admin) {
      grupoRodape.appendChild(criarCardProjetoDashboard({
        chave: 'canceladas',
        rotulo: 'MAPROS CANCELADAS',
        valor: canceladas.length,
        percentual: porcentagemIndicadorDashboard(canceladas.length, total),
        cor: '#77798b'
      }, 'indicador-canceladas-dashboard'));
    } else {
      const vazio = document.createElement('div');
      vazio.className = 'espaco-indicador-dashboard';
      vazio.setAttribute('aria-hidden', 'true');
      grupoRodape.appendChild(vazio);
    }
    grade.appendChild(grupoRodape);
  }

  function tituloIndicadorDashboard(chave) {
    const titulos = {
      todas: 'TODAS AS MAPROS',
      emAndamento: 'MAPROS EM ANDAMENTO',
      concluidas: 'MAPROS CONCLUÍDAS',
      naoAplicaveis: 'MAPROS NÃO APLICÁVEIS',
      naoIniciadas: 'MAPROS NÃO INICIADAS',
      replanejadas: 'MAPROS REPLANEJADAS',
      canceladas: 'MAPROS CANCELADAS',
      novasAtividades: 'MAPROS COM NOVAS ATIVIDADES',
      tempoMedio: 'MAPROS CONCLUÍDAS'
    };
    return titulos[chave] || 'TODAS AS MAPROS';
  }

  function formatarDataHoraDashboard(valor) {
    if (!valor) return '—';
    const data = new Date(valor);
    if (Number.isNaN(data.getTime())) {
      return formatarDataDashboard(String(valor).slice(0, 10));
    }
    return new Intl.DateTimeFormat('pt-BR', {
      timeZone: 'America/Sao_Paulo',
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    }).format(data).replace(',', '');
  }

  function compararValoresDashboard(a, b) {
    const numeroA = Number(a);
    const numeroB = Number(b);
    if (String(a).trim() !== '' && String(b).trim() !== '' &&
        Number.isFinite(numeroA) && Number.isFinite(numeroB)) return numeroA - numeroB;
    return String(a || '').localeCompare(String(b || ''), 'pt-BR', {
      numeric: true, sensitivity: 'base'
    });
  }

  function ordenarRegistrosDashboard(registros, colunas, ordenacao) {
    const coluna = colunas.find(function (item) { return item.campo === ordenacao.campo; }) || colunas[0];
    const direcao = ordenacao.direcao === 'desc' ? -1 : 1;
    return registros.slice().sort(function (a, b) {
      return compararValoresDashboard(coluna.valorOrdenacao
        ? coluna.valorOrdenacao(a) : coluna.valor(a), coluna.valorOrdenacao
        ? coluna.valorOrdenacao(b) : coluna.valor(b)) * direcao;
    });
  }

  function criarCabecalhoTabelaDashboard(cabecalho, colunas, ordenacao, aoOrdenar) {
    cabecalho.replaceChildren();
    colunas.forEach(function (coluna) {
      const th = document.createElement('th');
      const botao = document.createElement('button');
      botao.type = 'button';
      botao.className = 'botao-ordenar-tabela-dashboard';
      botao.textContent = coluna.rotulo;
      if (ordenacao.campo === coluna.campo) botao.dataset.direcao = ordenacao.direcao;
      botao.setAttribute('aria-label', 'Ordenar por ' + coluna.rotulo);
      botao.addEventListener('click', function () {
        aoOrdenar(coluna.campo);
      });
      th.appendChild(botao);
      cabecalho.appendChild(th);
    });
  }

  function paginarRegistrosDashboard(registros, pagina, tamanho) {
    const totalPaginas = Math.max(1, Math.ceil(registros.length / tamanho));
    const paginaValida = Math.min(Math.max(1, pagina), totalPaginas);
    return {
      pagina: paginaValida,
      totalPaginas: totalPaginas,
      registros: registros.slice((paginaValida - 1) * tamanho, paginaValida * tamanho)
    };
  }

  function atualizarPaginacaoDashboard(prefixo, pagina, totalPaginas, totalRegistros) {
    const nav = document.getElementById('paginacao-' + prefixo + '-dashboard');
    nav.hidden = totalRegistros <= 0;
    document.getElementById('pagina-' + prefixo + '-dashboard').textContent =
      'Página ' + pagina + ' de ' + totalPaginas;
    const anterior = nav.querySelector('[data-pagina-' + prefixo + '="anterior"]');
    const proxima = nav.querySelector('[data-pagina-' + prefixo + '="proxima"]');
    anterior.disabled = pagina <= 1;
    proxima.disabled = pagina >= totalPaginas;
  }

    const separador = estadoDashboard.dados.urlAplicacao.includes('?') ? '&' : '?';
    MaproUI.navigate(estadoDashboard.dados.urlAplicacao + separador +
      'pagina=mapros&mapro=' + encodeURIComponent(String(idMapro || '')),
      'Abrindo Mapro...');

    linha.tabIndex = 0;

    linha.setAttribute('aria-label', 'Abrir Mapro ' + idMapro + ': ' + String(nome || ''));

  function renderizarRoscaDashboard() {
    const canvas = document.getElementById('grafico-conclusao');
    const contexto = canvas.getContext('2d');
    contexto.clearRect(0, 0, canvas.width, canvas.height);
    const faixas = faixasDashboard();
    const total = faixas.reduce(function (soma, item) { return soma + item.total; }, 0);
    const centroX = canvas.width / 2;
    const centroY = canvas.height / 2;
    const menorLado = Math.min(canvas.width, canvas.height);
    const raio = menorLado * .34;
    const espessura = menorLado * .16;
    estadoDashboard.segmentosRosca = [];
    if (!total) {
      contexto.strokeStyle = '#eceef3';
      contexto.lineWidth = espessura;
      contexto.beginPath();
      contexto.arc(centroX, centroY, raio, 0, Math.PI * 2);
      contexto.stroke();
      contexto.fillStyle = '#5f6071';
      contexto.font = '700 13px Arial';
      contexto.textAlign = 'center';
      contexto.fillText('Sem dados', centroX, centroY + 4);
    } else {
      let inicio = -Math.PI / 2;
      faixas.forEach(function (faixa) {
        if (!faixa.total) return;
        const arco = (faixa.total / total) * Math.PI * 2;
        estadoDashboard.segmentosRosca.push({
          chave: faixa.chave, inicio: inicio, fim: inicio + arco,
          centroX: centroX, centroY: centroY, raio: raio, espessura: espessura
        });
        contexto.globalAlpha = estadoDashboard.filtroFaixaConclusao &&
          estadoDashboard.filtroFaixaConclusao !== faixa.chave ? .22 : 1;
        contexto.strokeStyle = faixa.cor;
        contexto.lineWidth = espessura;
        contexto.lineCap = 'round';
        contexto.beginPath();
        contexto.arc(centroX, centroY, raio, inicio + .025, inicio + arco - .025);
        contexto.stroke();
        inicio += arco;
      });
      contexto.globalAlpha = 1;
      contexto.fillStyle = '#06063d';
      contexto.font = '900 23px Arial';
      contexto.textAlign = 'center';
      contexto.fillText(total, centroX, centroY + 2);
      contexto.fillStyle = '#5f6071';
      contexto.font = '700 10px Arial';
      contexto.fillText('MAPROS', centroX, centroY + 20);
    }
    canvas.setAttribute('aria-label', 'Distribuição de ' + total +
      ' Mapros por percentual de conclusão. Use a legenda para filtrar.');
    canvas.title = 'Clique em uma faixa ou use a legenda para filtrar';
    const legenda = document.getElementById('legenda-conclusao');
    legenda.replaceChildren();
    faixas.forEach(function (faixa) {
      const ativo = estadoDashboard.filtroFaixaConclusao === faixa.chave;
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'item-legenda-dashboard' + (ativo ? ' ativo' : '');
      item.style.setProperty('--cor-faixa', faixa.cor);
      item.setAttribute('aria-pressed', String(ativo));
      item.setAttribute('aria-label', 'Filtrar por ' + faixa.rotulo + ': ' + faixa.total + ' Mapros');
      const cor = document.createElement('i');
      cor.style.background = faixa.cor;
      const texto = document.createElement('span');
      texto.textContent = faixa.rotulo + ' · ' + faixa.total;
      item.append(cor, texto);
      item.addEventListener('click', function () {
        alternarFaixaConclusaoDashboard(faixa.chave);
      });
      legenda.appendChild(item);
    });
  }

  function contarPorDashboard(campo) {
    const contagem = {};
    obterProjetosCruzadosDashboard({ignorarPortfolio: campo === 'portfolio'})
      .forEach(function (projeto) {
        const chave = String(projeto[campo] || 'Não informado');

  function renderizarBarrasDashboard(id, itens, cores) {
    const area = document.getElementById(id);
    const portfoliosOrdenados = id === 'grafico-portfolios'
      ? valoresUnicosDashboard('portfolio') : [];
    area.replaceChildren();
    const maior = Math.max.apply(null, itens.map(function (item) {
      return item.total;
    }).concat([1]));
    if (!itens.length) {
      const vazio = document.createElement('p');
      vazio.textContent = 'Nenhum projeto no recorte atual.';
      area.appendChild(vazio);
      return;
    }
    itens.forEach(function (item, indice) {
      const indiceCor = id === 'grafico-portfolios'
        ? Math.max(0, portfoliosOrdenados.indexOf(item.rotulo)) : indice;
      const ativo = id === 'grafico-portfolios' &&
        estadoDashboard.filtroGraficoPortfolio === item.rotulo;
      const linha = document.createElement('button');
      linha.type = 'button';
      linha.className = 'linha-barra-dashboard' + (ativo ? ' ativo' : '');
      linha.style.setProperty('--cor-barra-selecionada', cores[indiceCor % cores.length]);
      linha.setAttribute('aria-pressed', String(ativo));
      linha.setAttribute('aria-label', 'Filtrar por portfólio ' + item.rotulo +
        ': ' + item.total + ' Mapros');
      const rotulo = document.createElement('span');
      rotulo.textContent = item.rotulo;
      rotulo.title = item.rotulo;
      const trilho = document.createElement('div');
      trilho.className = 'trilho-barra-dashboard';
      const barra = document.createElement('i');
      barra.className = 'valor-barra-dashboard';
      barra.style.width = ((item.total / maior) * 100) + '%';
      barra.style.setProperty('--cor-barra', cores[indiceCor % cores.length]);
      const total = document.createElement('strong');
      total.textContent = item.total;
      trilho.appendChild(barra);
      linha.append(rotulo, trilho, total);
      linha.addEventListener('click', function () {
        if (id !== 'grafico-portfolios') return;
        estadoDashboard.filtroGraficoPortfolio = ativo ? '' : item.rotulo;
        estadoDashboard.paginaMapros = 1;
        renderizarDashboard();
      });
      area.appendChild(linha);
    });
  }

  function formatarDataDashboard(valor) {
    const partes = String(valor || '').split('-');
    return partes.length === 3 ? partes[2] + '/' + partes[1] + '/' + partes[0] : '—';
  }

  function criarChipFiltroDashboard(rotulo, aoRemover) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip-filtro-dashboard';
    chip.textContent = rotulo;
    chip.setAttribute('aria-label', 'Remover filtro ' + rotulo);
    chip.addEventListener('click', aoRemover);
    return chip;
  }

  function atualizarResumoFiltrosDashboard() {
    const resumo = document.getElementById('resumo-filtros-dashboard');
    const area = document.getElementById('chips-filtros-dashboard');
    area.replaceChildren();
    estadoDashboard.portfolios.forEach(function (portfolio) {
      area.appendChild(criarChipFiltroDashboard('Portfólio: ' + portfolio, function () {
        estadoDashboard.portfolios = estadoDashboard.portfolios.filter(function (item) {
          return item !== portfolio;
        });
        atualizarRotuloPortfoliosDashboard();
        montarMenuPortfoliosDashboard();
        aplicarFiltrosDashboard();
      }));
    });
    if (estadoDashboard.aba === 'mapros') {
      const filtros = [
        ['filtro-contagiro', 'Contagiro'], ['filtro-inicio-de', 'Início de'],
        ['filtro-inicio-ate', 'Início até'], ['filtro-prazo-de', 'Prazo de'],
        ['filtro-prazo-ate', 'Prazo até'], ['filtro-status', 'Status'],
        ['filtro-area', 'Área'], ['filtro-nivel', 'Nível'],
        ['filtro-lider', 'Líder'], ['filtro-mapro', 'Mapro']
      ];
      filtros.forEach(function (item) {
        const campo = document.getElementById(item[0]);
        if (!campo.value) return;
        area.appendChild(criarChipFiltroDashboard(item[1] + ': ' + campo.value, function () {
          campo.value = '';
          if (item[0] === 'filtro-lider') fecharOpcoesLiderDashboard();
          aplicarFiltrosDashboard();
        }));
      });
      if (estadoDashboard.indicadorDetalhe) {
        area.appendChild(criarChipFiltroDashboard(
          tituloIndicadorDashboard(estadoDashboard.indicadorDetalhe), function () {
            estadoDashboard.indicadorDetalhe = '';
            estadoDashboard.paginaMapros = 1;
            renderizarDashboard();
          }
        ));
      }
      if (estadoDashboard.filtroFaixaConclusao) {
        const nomesFaixa = {menos50: 'Conclusão: menos de 50%', '50a70': 'Conclusão: 50% a 70%',
          '70a90': 'Conclusão: 70% a 90%', '90mais': 'Conclusão: 90% ou mais'};
        area.appendChild(criarChipFiltroDashboard(
          nomesFaixa[estadoDashboard.filtroFaixaConclusao], function () {
            estadoDashboard.filtroFaixaConclusao = '';
            estadoDashboard.paginaMapros = 1;
            renderizarDashboard();
          }
        ));
      }
      if (estadoDashboard.filtroGraficoPortfolio) {
        area.appendChild(criarChipFiltroDashboard(
          'Gráfico: ' + estadoDashboard.filtroGraficoPortfolio, function () {
            estadoDashboard.filtroGraficoPortfolio = '';
            estadoDashboard.paginaMapros = 1;
            renderizarDashboard();
          }
        ));
      }
    } else if (estadoDashboard.indicadorAtividades) {
      area.appendChild(criarChipFiltroDashboard(
        tituloAtividadesDashboard(estadoDashboard.indicadorAtividades), function () {
          estadoDashboard.indicadorAtividades = '';
          estadoDashboard.paginaAtividades = 1;
          renderizarDashboard();
        }
      ));
    }
    resumo.hidden = !area.children.length;
  }

  function limparTodosFiltrosDashboard() {
    document.querySelectorAll('.filtros-dashboard input, .filtros-dashboard select')
      .forEach(function (campo) { campo.value = ''; });
    estadoDashboard.portfolios = [];
    estadoDashboard.indicadorDetalhe = '';
    estadoDashboard.indicadorAtividades = '';
    estadoDashboard.filtroFaixaConclusao = '';
    estadoDashboard.filtroGraficoPortfolio = '';
    estadoDashboard.buscaTabelaMapros = '';
    estadoDashboard.buscaTabelaAtividades = '';
    estadoDashboard.paginaMapros = 1;
    estadoDashboard.paginaAtividades = 1;
    document.getElementById('pesquisa-tabela-mapros-dashboard').value = '';
    document.getElementById('pesquisa-tabela-atividades-dashboard').value = '';
    document.getElementById('pesquisar-portfolio-dashboard').value = '';
    atualizarRotuloPortfoliosDashboard();
    montarMenuPortfoliosDashboard();
    fecharOpcoesLiderDashboard();
    aplicarFiltrosDashboard();
  }

  function criarDebounceDashboard(funcao, espera) {
    let temporizador;
    return function () {
      const argumentos = arguments;
      clearTimeout(temporizador);
      temporizador = setTimeout(function () { funcao.apply(null, argumentos); }, espera);
    };
  }

  function alternarPainelDashboard(botaoId, painelId) {
    const botao = document.getElementById(botaoId);
    const painel = document.getElementById(painelId);
    painel.hidden = !painel.hidden;
    botao.setAttribute('aria-expanded', String(!painel.hidden));
    if (!painel.hidden) {
      const primeiroCampo = painel.querySelector('input, select');
      if (primeiroCampo) primeiroCampo.focus();
    }
  }

  document.querySelectorAll('[data-aba-dashboard]').forEach(function (botao) {
    botao.addEventListener('click', function () {
      alternarAbaDashboard(botao.dataset.abaDashboard);
      aplicarFiltrosDashboard();
    });
    botao.addEventListener('keydown', function (evento) {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(evento.key)) return;
      evento.preventDefault();
      const abas = Array.from(document.querySelectorAll('[data-aba-dashboard]'));
      const indice = abas.indexOf(botao);
      const destino = evento.key === 'Home' ? 0 : evento.key === 'End' ? abas.length - 1
        : (indice + (evento.key === 'ArrowRight' ? 1 : -1) + abas.length) % abas.length;
      abas[destino].focus();
      abas[destino].click();
    });
  });
  document.getElementById('abrir-filtros-dashboard').addEventListener('click', function () {
    alternarPainelDashboard('abrir-filtros-dashboard', 'painel-filtros-dashboard');
  });
  document.getElementById('abrir-portfolios-dashboard').addEventListener('click', function () {
    alternarPainelDashboard('abrir-portfolios-dashboard', 'menu-selecao-portfolios');
  });
  document.getElementById('alternar-painel-indicadores-atividades-dashboard')
    .addEventListener('click', function () {
      const painel = document.getElementById('painel-indicadores-atividades-dashboard');
      const botao = document.getElementById('alternar-painel-indicadores-atividades-dashboard');
      estadoDashboard.menuIndicadoresAtividadesRecolhido =
        !estadoDashboard.menuIndicadoresAtividadesRecolhido;
      painel.classList.toggle('recolhido', estadoDashboard.menuIndicadoresAtividadesRecolhido);
      botao.textContent = estadoDashboard.menuIndicadoresAtividadesRecolhido ? '›' : '‹';
      botao.setAttribute('aria-expanded',
        String(!estadoDashboard.menuIndicadoresAtividadesRecolhido));
      botao.setAttribute('aria-label', estadoDashboard.menuIndicadoresAtividadesRecolhido
        ? 'Expandir indicadores' : 'Recolher indicadores');
    });
  document.getElementById('pesquisar-portfolio-dashboard')
    .addEventListener('input', montarMenuPortfoliosDashboard);
  document.getElementById('filtro-lider').addEventListener('focus', abrirOpcoesLiderDashboard);
  const aplicarFiltrosComEsperaDashboard = criarDebounceDashboard(aplicarFiltrosDashboard, 250);
  document.getElementById('filtro-lider').addEventListener('input', function () {
    abrirOpcoesLiderDashboard();
    aplicarFiltrosComEsperaDashboard();
  });
  document.getElementById('filtro-lider').addEventListener('keydown', function (evento) {
    if (evento.key === 'ArrowDown') {
      evento.preventDefault();
      abrirOpcoesLiderDashboard();
      const primeira = document.querySelector('#opcoes-lider-dashboard .opcao-lider-dashboard');
      if (primeira) primeira.focus();
    }
    if (evento.key === 'Escape') fecharOpcoesLiderDashboard();
  });
  document.addEventListener('keydown', function (evento) {
    if (evento.key !== 'Escape') return;
    ['menu-selecao-portfolios', 'painel-filtros-dashboard', 'opcoes-lider-dashboard']
      .forEach(function (id) {
      document.getElementById(id).hidden = true;
    });
    ['abrir-portfolios-dashboard', 'abrir-filtros-dashboard'].forEach(function (id) {
      document.getElementById(id).setAttribute('aria-expanded', 'false');
    });
    document.getElementById('filtro-lider').setAttribute('aria-expanded', 'false');
  });
  document.addEventListener('click', function (evento) {
    if (!evento.target.closest('.seletor-portfolio-dashboard')) {
      document.getElementById('menu-selecao-portfolios').hidden = true;
      document.getElementById('abrir-portfolios-dashboard')
        .setAttribute('aria-expanded', 'false');
    }
    if (!evento.target.closest('.seletor-lider-dashboard')) fecharOpcoesLiderDashboard();
  });
  document.querySelectorAll('.filtros-dashboard input, .filtros-dashboard select')
    .forEach(function (campo) {
      if (campo.id === 'filtro-lider') return;
      const evento = campo.type === 'search' ? 'input' : 'change';
      campo.addEventListener(evento,
        campo.type === 'search' ? aplicarFiltrosComEsperaDashboard : aplicarFiltrosDashboard);
    });
  document.getElementById('limpar-filtros-dashboard')
    .addEventListener('click', limparTodosFiltrosDashboard);
  document.getElementById('limpar-todos-filtros-dashboard')
    .addEventListener('click', limparTodosFiltrosDashboard);
  document.getElementById('atualizar-dashboard').addEventListener('click', iniciarDashboard);
  document.getElementById('grafico-conclusao').addEventListener('click', function (evento) {
    const canvas = evento.currentTarget;
    const caixa = canvas.getBoundingClientRect();
    if (!caixa.width || !caixa.height) return;
    const x = (evento.clientX - caixa.left) * canvas.width / caixa.width;
    const y = (evento.clientY - caixa.top) * canvas.height / caixa.height;
    const segmento = estadoDashboard.segmentosRosca.find(function (item) {
      const distancia = Math.hypot(x - item.centroX, y - item.centroY);
      let angulo = Math.atan2(y - item.centroY, x - item.centroX);
      if (angulo < -Math.PI / 2) angulo += Math.PI * 2;
      return Math.abs(distancia - item.raio) <= item.espessura / 2 + 3 &&
        angulo >= item.inicio && angulo <= item.fim;
    });
    if (segmento) alternarFaixaConclusaoDashboard(segmento.chave);
  });
  const buscarMaprosComEsperaDashboard = criarDebounceDashboard(function (valor) {
    estadoDashboard.buscaTabelaMapros = valor;
    estadoDashboard.paginaMapros = 1;
    renderizarDetalhesIndicadorDashboard();
  }, 250);
  document.getElementById('pesquisa-tabela-mapros-dashboard').addEventListener('input', function () {
    buscarMaprosComEsperaDashboard(this.value);
  });
  document.getElementById('tamanho-pagina-mapros-dashboard').addEventListener('change', function () {
    estadoDashboard.tamanhoPaginaMapros = Number(this.value) || 20;
    estadoDashboard.paginaMapros = 1;
    renderizarDetalhesIndicadorDashboard();
  });
  document.querySelectorAll('[data-pagina-mapros]').forEach(function (botao) {
    botao.addEventListener('click', function () {
      estadoDashboard.paginaMapros += botao.dataset.paginaMapros === 'proxima' ? 1 : -1;
      renderizarDetalhesIndicadorDashboard();
    });
  });
  const buscarAtividadesComEsperaDashboard = criarDebounceDashboard(function (valor) {
    estadoDashboard.buscaTabelaAtividades = valor;
    estadoDashboard.paginaAtividades = 1;
    renderizarMinhasAtividadesDashboard();
  }, 250);
  document.getElementById('pesquisa-tabela-atividades-dashboard')
    .addEventListener('input', function () { buscarAtividadesComEsperaDashboard(this.value); });
  document.getElementById('tamanho-pagina-atividades-dashboard')
    .addEventListener('change', function () {
      estadoDashboard.tamanhoPaginaAtividades = Number(this.value) || 20;
      estadoDashboard.paginaAtividades = 1;
      renderizarMinhasAtividadesDashboard();
    });
  document.querySelectorAll('[data-pagina-atividades]').forEach(function (botao) {
    botao.addEventListener('click', function () {
      estadoDashboard.paginaAtividades +=
        botao.dataset.paginaAtividades === 'proxima' ? 1 : -1;
      renderizarMinhasAtividadesDashboard();
    });
  });
  document.getElementById('fechar-detalhes-indicador-dashboard')
    .addEventListener('click', function () {
      estadoDashboard.indicadorDetalhe = '';
      estadoDashboard.paginaMapros = 1;
      renderizarDashboard();
    });
  document.getElementById('limpar-filtro-atividades-dashboard')
    .addEventListener('click', function () {
      estadoDashboard.indicadorAtividades = '';
      estadoDashboard.paginaAtividades = 1;
      renderizarDashboard();
    });
  document.getElementById('voltar-dashboard').addEventListener('click', function () {
    if (estadoDashboard.dados) {
      MaproUI.navigate(estadoDashboard.dados.urlAplicacao, 'Voltando ao início...');
    }
  });
  iniciarDashboard();
</script>
